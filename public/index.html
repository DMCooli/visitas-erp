        if (chk.checked && !chk.disabled) {
          const p = chk.dataset.prod;
          const qty = chk.closest('.p_row').querySelector('.p_qty').value.trim();
          if (!qty || parseInt(qty, 10) <= 0) { hasError = true; toast('Introduce la cantidad para ' + p, 1); }
          else selected.push(`${p} (${parseInt(qty, 10)})`);
        }
      });
      if (hasError) return;
      if (!selected.length) { toast('Selecciona al menos un producto disponible o indica "No"', 1); return; }
      hidDetalleProd.value = selected.join(', ');
      selProductos.value = 'Sí';
      close(); updateProductosUI();
      toast('Productos registrados correctamente');
    };
  };

  if (selProductos) {
    selProductos.onchange = () => {
      if (selProductos.value === 'Sí') openProductosModal();
      else { if (hidDetalleProd) hidDetalleProd.value = ''; updateProductosUI(); }
    };
    const btnEditProd = $('#btn_editar_productos');
    if (btnEditProd) btnEditProd.onclick = openProductosModal;
  }

  // --- Componente de Redes Sociales ---
  const REDES_OPCIONES = ['Facebook', 'Instagram', 'LinkedIn', 'Otra', 'Threads', 'TikTok', 'X'];

  const syncRedesSociales = () => {
    const list = $('#redes_list');
    if (!list) return;
    const items = [];
    list.querySelectorAll('.red-row').forEach(row => {
      const sel = row.querySelector('.red-select')?.value;
      if (!sel) return;
      let redNom = sel;
      if (sel === 'Otra') {
        redNom = (row.querySelector('.red-otra-nombre')?.value || '').trim() || 'Otra';
      }
      const cuenta = (row.querySelector('.red-cuenta')?.value || '').trim();
      if (cuenta) {
        items.push({ red: redNom, cuenta });
      }
    });

    const fb = items.find(r => r.red.toLowerCase() === 'facebook');
    const ig = items.find(r => r.red.toLowerCase() === 'instagram');
    const otros = items.filter(r => r.red.toLowerCase() !== 'facebook' && r.red.toLowerCase() !== 'instagram');

    if ($('#f_facebook')) $('#f_facebook').value = fb ? fb.cuenta : '';
    if ($('#f_instagram')) $('#f_instagram').value = ig ? ig.cuenta : '';
    if ($('#f_otras_redes')) $('#f_otras_redes').value = otros.map(r => `${r.red}: ${r.cuenta}`).join(' | ');
    if ($('#f_redes_sociales')) $('#f_redes_sociales').value = items.length ? JSON.stringify(items) : '';
  };

  const addRedSocialRow = (redVal = '', nombreOtra = '', cuentaVal = '') => {
    const list = $('#redes_list');
    if (!list) return null;

    const row = document.createElement('div');
    row.className = 'red-row';
    row.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;';

    const optsHtml = REDES_OPCIONES.map(r => `<option value="${r}"${r === redVal ? ' selected' : ''}>${r}</option>`).join('');

    row.innerHTML = `
      <div style="flex:0 0 135px;width:135px">
        <select class="red-select" style="width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;cursor:pointer">
          <option value="">Red social…</option>
          ${optsHtml}
        </select>
      </div>
      <div class="red-otra-wrap" style="display:${redVal === 'Otra' ? 'block' : 'none'};flex:0 0 160px;min-width:130px;max-width:180px">
        <input type="text" class="red-otra-nombre" value="${esc(nombreOtra)}" placeholder="Nombre de red (ej: YouTube)" style="width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px">
      </div>
      <div class="red-cuenta-wrap" style="display:${redVal ? 'block' : 'none'};flex:1;min-width:150px">
        <input type="text" class="red-cuenta" value="${esc(cuentaVal)}" placeholder="@cuenta o enlace" style="width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px">
      </div>
      <button type="button" class="btn dg sm red-del" title="Eliminar red" style="padding:5px 9px;font-size:13px;line-height:1;margin-left:auto">✕</button>
    `;

    const sel = row.querySelector('.red-select');
    const otraWrap = row.querySelector('.red-otra-wrap');
    const otraInput = row.querySelector('.red-otra-nombre');
    const cuentaWrap = row.querySelector('.red-cuenta-wrap');
    const cuentaInput = row.querySelector('.red-cuenta');
    const delBtn = row.querySelector('.red-del');

    sel.onchange = () => {
      const val = sel.value;
      if (!val) {
        otraWrap.style.display = 'none';
        cuentaWrap.style.display = 'none';
      } else if (val === 'Otra') {
        otraWrap.style.display = 'block';
        cuentaWrap.style.display = 'block';
        otraInput.focus();
      } else {
        otraWrap.style.display = 'none';
        cuentaWrap.style.display = 'block';
        cuentaInput.focus();
      }
      syncRedesSociales();
    };

    otraInput.oninput = syncRedesSociales;
    cuentaInput.oninput = syncRedesSociales;

    delBtn.onclick = () => {
      row.remove();
      syncRedesSociales();
      if (!list.querySelectorAll('.red-row').length) {
        addRedSocialRow();
      }
    };

    list.appendChild(row);
    syncRedesSociales();
    return row;
  };

  const btnAddRed = $('#btn_add_red');
  if (btnAddRed) {
    btnAddRed.onclick = (e) => {
      e.preventDefault();
      const r = addRedSocialRow();
      if (r) {
        const s = r.querySelector('.red-select');
        if (s) s.focus();
      }
    };
  }

  const populateRedesSociales = (x) => {
    const list = $('#redes_list');
    if (!list) return;
    list.innerHTML = '';
    let loaded = false;

    if (x && x.redes_sociales) {
      try {
        const parsed = typeof x.redes_sociales === 'string' ? JSON.parse(x.redes_sociales) : x.redes_sociales;
        if (Array.isArray(parsed) && parsed.length) {
          parsed.forEach(item => {
            if (!item.red && !item.cuenta) return;
            const standard = REDES_OPCIONES.filter(r => r !== 'Otra').find(r => r.toLowerCase() === (item.red || '').toLowerCase());
            if (standard) {
              addRedSocialRow(standard, '', item.cuenta || '');
            } else {
              addRedSocialRow('Otra', item.red || '', item.cuenta || '');
            }
            loaded = true;
          });
        }
      } catch (e) {}
    }

    if (!loaded && x) {
      if (x.facebook) {
        addRedSocialRow('Facebook', '', x.facebook);
        loaded = true;
      }
      if (x.instagram) {
        addRedSocialRow('Instagram', '', x.instagram);
        loaded = true;
      }
      if (x.otras_redes) {
        const parts = x.otras_redes.split('|');
        parts.forEach(p => {
          const colonIdx = p.indexOf(':');
          if (colonIdx > -1) {
            const rName = p.slice(0, colonIdx).trim();
            const rAcct = p.slice(colonIdx + 1).trim();
            const standard = REDES_OPCIONES.filter(r => r !== 'Otra').find(r => r.toLowerCase() === rName.toLowerCase());
            if (standard) {
              addRedSocialRow(standard, '', rAcct);
            } else {
              addRedSocialRow('Otra', rName, rAcct);
            }
          } else if (p.trim()) {
            addRedSocialRow('Otra', '', p.trim());
          }
          loaded = true;
        });
      }
    }

    if (!loaded) {
      addRedSocialRow();
    }
  };

  populateRedesSociales(null);
  // --- Fin Redes Sociales ---

  // Campos siempre disponibles y editables (sin bloqueo automático)
  const setProtectedMode = () => {};

  const getFullCedula = () => {
    const pref = $('#ced_pref') ? $('#ced_pref').value : 'V-';
    const num = $('#ced_num') ? $('#ced_num').value.replace(/[^0-9]/g, '').slice(0, 12) : '';
    return num ? (pref + num) : '';
  };

  const checkCedula = async () => {
    const full = getFullCedula();
    const badge = $('#visita_status_badge');
    const info = $('#ced_info_box');
    const spin = $('#ced_spinner');

    if (!full || $('#ced_num').value.trim().length < 3) {
      toast('Ingresa la cédula para verificar', 1);
      return;
    }

    lastSearchedCedula = full;
    spin.style.display = 'block';

    try {
      const r = await api('/api/visits/by-cedula/' + encodeURIComponent(full));
      spin.style.display = 'none';

      if (r.found && r.visit) {
        currentTipoVisita = 'recurrente';
        const x = r.visit;
        badge.innerHTML = '<span class="badge" style="background:rgba(59,130,246,.15);color:#2563eb;font-size:12px;padding:4px 10px">✓ Registrado</span>';
        info.innerHTML = `<div style="color:var(--tx);background:rgba(15,157,138,.08);padding:10px 14px;border-radius:8px;border:1px solid rgba(15,157,138,.25);line-height:1.5">
          <b style="color:var(--ac)">✓ Médico registrado:</b> <b>${esc(x.cliente || x.razon_social)}</b> · ${esc(x.razon_social)} <span style="color:var(--mut)">(${esc(x.especialidad || 'Sin especialidad')})</span>
          <div style="font-size:12px;color:var(--mut);margin-top:4px">Datos anteriores cargados automáticamente en el formulario.</div>
        </div>`;

        PREFILL.forEach(k => {
          const el = $('#f_' + k);
          if (el) el.value = x[k] || '';
        });
        populateRedesSociales(x);
        if ($('#f_cedula')) $('#f_cedula').value = full;
        if (x.estado) updateCiudades(x.estado, true);

        // Reset commercial evaluation for this new visit
        if (selMuestras) selMuestras.value = '';
        if (hidDetalle) hidDetalle.value = '';
        if (boxMuestras) boxMuestras.style.display = 'none';
        if (selProductos) selProductos.value = '';
        if (hidDetalleProd) hidDetalleProd.value = '';
        if (boxProductos) boxProductos.style.display = 'none';
        ['usaria_producto','prescribe_suplementos','prescribira_suplementos','comprometido','observaciones'].forEach(k => {
          const el = $('#f_' + k); if (el) el.value = '';
        });

        toast('Médico registrado · Datos cargados');
      } else {
        currentTipoVisita = 'primera';
        badge.innerHTML = '<span class="badge" style="background:rgba(15,157,138,.15);color:var(--ac);font-size:12px;padding:4px 10px">✨ Primera visita</span>';
        info.innerHTML = `<div style="color:var(--mut);background:rgba(0,0,0,.03);padding:8px 12px;border-radius:8px">No existe registro previo con la cédula <b>${esc(full)}</b>. El sistema indica que es una <b>primera visita</b>.</div>`;
        if ($('#f_cedula')) $('#f_cedula').value = full;
        populateRedesSociales(null);
        toast('No registrado · Primera visita');
      }
    } catch (e) {
      spin.style.display = 'none';
      toast(e.message || 'Error al verificar', 1);
    }
  };

  $('#ced_num').oninput = e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 12);
  };
  $('#ced_num').onkeydown = e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      checkCedula();
    }
  };
  $('#btn_verificar_cedula').onclick = () => checkCedula();

  $('#btn_toggle_lookup').onclick = () => {
    const w = $('#lkw');
    w.style.display = w.style.display === 'none' ? 'block' : 'none';
  };

  const updateCiudades = (st, keepVal = false) => {
    const dl = $('#dl_ciudades'), ci = $('#f_ciudad');
    if (!dl) return;
    const list = (geo && geo[st]) || [];
    dl.innerHTML = list.map(c => `<option value="${esc(c)}">`).join('');
    if (!keepVal && ci) ci.value = '';
  };
  const selEstado = $('#f_estado');
  if (selEstado) {
    selEstado.onchange = () => updateCiudades(selEstado.value);
    if (selEstado.value) updateCiudades(selEstado.value, true);
  }

  let tm; $('#lk').oninput = e => { clearTimeout(tm); tm = setTimeout(async () => {
    const v = e.target.value.trim(), box = $('#lkr'); if (v.length < 2) { box.style.display = 'none'; return; }
    const r = await api('/api/visits/lookup?q=' + encodeURIComponent(v)); box.style.display = 'block';
    box.innerHTML = r.map((x, i) => `<div data-i="${i}"><b>${esc(x.cliente || '—')}</b> · ${esc(x.razon_social)} <span style="color:var(--mut)">${esc(x.especialidad || '')}</span></div>`).join('') || '<div>Sin coincidencias</div>';
    box.querySelectorAll('[data-i]').forEach(d => d.onclick = () => {
      const x = r[d.dataset.i];
      PREFILL.forEach(k => { const el = $('#f_' + k); if (el) el.value = x[k] || ''; });
      populateRedesSociales(x);
      if (x.estado) updateCiudades(x.estado, true);
      updateMuestrasUI();
      updateProductosUI();
      if (x.cedula) {
        const m = /^([VEPJG]-)(.+)$/i.exec(x.cedula.trim());
        if (m) {
          $('#ced_pref').value = m[1].toUpperCase();
          $('#ced_num').value = m[2];
        } else {
          $('#ced_num').value = x.cedula;
        }
      }
      currentTipoVisita = 'recurrente';
      $('#visita_status_badge').innerHTML = '<span class="badge" style="background:rgba(59,130,246,.15);color:#2563eb;font-size:12px;padding:4px 10px">✓ Registrado</span>';
      $('#ced_info_box').innerHTML = `<div style="color:var(--tx);background:rgba(15,157,138,.08);padding:10px 14px;border-radius:8px;border:1px solid rgba(15,157,138,.25)"><b>✓ Médico registrado:</b> <b>${esc(x.cliente || x.razon_social)}</b> · Datos cargados en el formulario.</div>`;
      box.style.display = 'none';
      toast('Médico registrado · Datos cargados');
    });
  }, 300); };

  const c = $('#sig'), x = c.getContext('2d'); let d = false, dirty = false;
  const clr = () => { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.strokeStyle = '#111'; x.lineWidth = 3; x.lineCap = 'round'; dirty = false; }; clr();
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { d = dirty = true; x.beginPath(); x.moveTo(...pos(e)); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (d) { x.lineTo(...pos(e)); x.stroke(); } };
  c.onpointerup = () => d = false; $('#sigc').onclick = clr;
  let foto = null;
  $('#foto').onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image(); im.onload = () => {
    const s = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = im.width * s; cv.height = im.height * s;
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); foto = cv.toDataURL('image/jpeg', .8); $('#fprev').src = foto; $('#fprev').style.display = 'block'; }; im.src = URL.createObjectURL(f); };
  $('#gps').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => $('#f_ubicacion').value = p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6), () => toast('No se pudo obtener la ubicación (requiere HTTPS o localhost y permiso)', 1)) : toast('Geolocalización no disponible', 1);

  $('#save').onclick = async () => {
    const fullCed = getFullCedula();
    if ($('#f_cedula')) $('#f_cedula').value = fullCed;

    const body = {
      tipo_visita: currentTipoVisita || 'primera',
      cedula: fullCed,
      foto,
      firma: dirty ? c.toDataURL('image/png') : null,
      ubicacion: $('#f_ubicacion').value
    };
    ALLF.forEach(f => {
      const el = $('#f_' + f[0]);
      if (el) body[f[0]] = el.value;
    });
    body.cedula = fullCed;
    body.tipo_visita = currentTipoVisita || 'primera';

    $('#save').disabled = true;

    const client_uuid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('off_' + Date.now() + '_' + Math.random().toString(36).slice(2));
    const fecha_offline = new Date().toISOString();
    body.client_uuid = client_uuid;
    body.fecha_offline = fecha_offline;

    try {
      if (!navigator.onLine) {
        throw new Error('NETWORK_OFFLINE');
      }
      await api('/api/visits', { method: 'POST', body });
      toast('Visita guardada exitosamente en el servidor');
      go('visitas');
    } catch (e) {
      if (e.isOffline || e.message === 'NETWORK_OFFLINE' || !navigator.onLine) {
        await dbSaveOutbox({
          client_uuid,
          fecha_offline,
          body,
          created_at: Date.now()
        });
        updateNetStatus();
        toast('📱 Visita guardada localmente en tu dispositivo. Se sincronizará automáticamente al volver la señal.');
        go('visitas');
      } else {
        toast(e.message, 1);
        $('#save').disabled = false;
      }
    }
  };
}

    <div class="card"><div class="scroll" id="tbl"></div><div class="row2" id="pg" style="margin-top:10px;justify-content:space-between"></div></div>`;
  const fq = () => new URLSearchParams([...document.querySelectorAll('[data-f]')].map(e => [e.dataset.f, e.value]).filter(x => x[1]));
  const load = async () => {

              <div style="color:var(--mut);font-size:12px;margin-top:2px">Estas visitas se encuentran almacenadas de forma segura en tu dispositivo y se enviarán automáticamente al recuperar señal.</div>
            </div>
            <button class="btn sm" id="btn_sync_now" style="background:#f59e0b;color:#fff;border:none">🔄 Sincronizar ahora</button>
          </div>
        </div>
      ` : '';
      if ($('#btn_sync_now')) $('#btn_sync_now').onclick = () => { toast('Sincronizando...'); checkPendingAndSync(); };

    try {

      $('#tbl').innerHTML = `<table><thead><tr><th>Fecha</th>${me.admin ? '<th>Visitador</th>' : ''}<th>Tipo</th><th>Lugar</th><th>Razón social</th><th>Cliente</th><th>Especialidad</th><th>Ciudad</th></tr></thead><tbody>

      if (cached && cached.rows) {
        rows = cached.rows;
        $('#tbl').innerHTML = `<div style="padding:8px 12px;background:rgba(245,158,11,.1);border-radius:6px;font-size:12px;color:#d97706;margin-bottom:8px">Modo sin conexión: mostrando visitas almacenadas en caché.</div><table><thead><tr><th>Fecha</th>${me.admin ? '<th>Visitador</th>' : ''}<th>Tipo</th><th>Lugar</th><th>Razón social</th><th>Cliente</th><th>Especialidad</th><th>Ciudad</th></tr></thead><tbody>
          ${rows.map((v, i) => `<tr class="row" data-i="${i}"><td>${fmtDT(v.fecha_hora)}</td>${me.admin ? `<td>${esc(v.visitador_nombre || v.visitador_email)}</td>` : ''}<td><span class="badge">${v.tipo_visita === 'recurrente' ? 'Recurrente' : 'Primera'}</span></td><td>${esc(v.lugar_visita)}</td><td>${esc(v.razon_social)}</td><td>${esc(v.cliente)}</td><td>${esc(v.especialidad)}</td><td>${esc(v.ciudad)}</td></tr>`).join('')}</tbody></table>`;
        $('#pg').innerHTML = `<span style="color:var(--mut)">Modo offline</span>`;
        document.querySelectorAll('tr.row').forEach(t => t.onclick = () => detail(rows[t.dataset.i], load));
      } else {
        $('#tbl').innerHTML = '<div style="padding:24px;text-align:center;color:var(--mut)">Modo sin conexión. Las visitas registradas se sincronizarán al conectarte.</div>';

    }
  };
  $('#ap').onclick = () => { page = 0; load(); };
  $('#lm').onclick = () => { document.querySelectorAll('[data-f]').forEach(e => e.value = ''); page = 0; load(); };
  if (me.admin) $('#ex').onclick = () => location.href = '/api/visits/export.csv?' + fq();
  page = 0; load();
}
function detail(v, reload) {
  const ub = v.ubicacion && /^-?\d/.test(v.ubicacion) ? `<a href="https://www.google.com/maps?q=${encodeURIComponent(v.ubicacion)}" target="_blank" rel="noopener">${esc(v.ubicacion)}</a>` : esc(v.ubicacion);

  const formatVal = (k, val) => {
    if (k === 'tipo_visita') return esc(val === 'recurrente' ? 'Recurrente' : 'Primera');
    if (k === 'redes_sociales') {
      try {
        const arr = typeof val === 'string' ? JSON.parse(val) : val;
        if (Array.isArray(arr) && arr.length) {
          return arr.map(r => `<span style="display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);font-size:12px;margin:2px 4px 2px 0"><b>${esc(r.red)}:</b> ${esc(r.cuenta)}</span>`).join('');
        }
      } catch (e) {}
    }
    return esc(val);
  };

  const keysToShow = ['tipo_visita', ...ALLF.map(f => f[0])].filter(k => {
    if (!v[k]) return false;
    if (v.redes_sociales && ['facebook','instagram','otras_redes'].includes(k)) return false;
    return true;
  });

  const items = [['Fecha y hora', esc(fmtDT(v.fecha_hora))], ['Visitador', esc(v.visitador_nombre || v.visitador_email)]]
    .concat(keysToShow.map(k => [LABEL[k] || k, formatVal(k, v[k])]));
  if (v.ubicacion) items.push(['Ubicación', ub]);
  if (v.foto) {
    const isUrl = v.foto.startsWith('/uploads/') || v.foto.startsWith('http') || v.foto.startsWith('data:');
    items.push(['Foto', isUrl ? `<img src="${v.foto}" style="max-width:100%;max-height:360px;object-fit:contain;border-radius:8px;border:1px solid var(--bd);display:block;margin-top:4px">` : `<span style="color:var(--mut);font-size:12px">${esc(v.foto)}</span>`]);
  }
  if (v.firma) {
    const isUrl = v.firma.startsWith('/uploads/') || v.firma.startsWith('http') || v.firma.startsWith('data:');
    items.push(['Firma', isUrl ? `<img src="${v.firma}" style="max-width:280px;border-radius:6px;background:#fff;border:1px solid var(--bd);display:block;margin-top:4px">` : `<span style="color:var(--mut);font-size:12px">${esc(v.firma)}</span>`]);
  }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><div class="row2" style="justify-content:space-between"><h2>Visita #${v.id}</h2><span>${me.admin ? '<button class="btn dg sm" id="del">Eliminar</button> ' : ''}<button class="btn sec sm" id="cl">Cerrar</button></span></div>
    <dl class="kv">${items.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl></div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) m.remove(); }; m.querySelector('#cl').onclick = () => m.remove();
  const d = m.querySelector('#del'); if (d) d.onclick = async () => { if (confirm('¿Eliminar esta visita definitivamente?')) { await api('/api/visits/' + v.id, { method: 'DELETE' }); m.remove(); toast('Visita eliminada'); reload(); } };
}

function openUnifiedImportModal(initialSubcat) {
  let impType = (initialSubcat === 'productos') ? 'productos' : 'muestras';
  let rawFileContent = null;
  let parsedItems = [];

  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="card" style="max-width:580px;width:100%;max-height:88vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0;font-size:18px;display:inline-flex;align-items:center;gap:8px">
          📥 Importar desde Archivo CSV
        </h2>
        <button type="button" class="btn sec sm" id="imp_close" style="padding:2px 8px">✕</button>
      </div>

      <div style="margin-bottom:14px">
        <label style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;display:block;margin-bottom:6px">
          ¿Qué deseas importar?
        </label>
        <div class="seg" style="display:inline-flex;width:100%;margin:0">
          <button type="button" id="imp_tab_mue" class="${impType === 'muestras' ? 'on' : ''}" style="flex:1">
            📦 1) Muestras (Lista simple)
          </button>
          <button type="button" id="imp_tab_prd" class="${impType === 'productos' ? 'on' : ''}" style="flex:1">
            🏷️ 2) Productos (Cod. | Producto)
          </button>
        </div>
      </div>

      <div id="imp_guide" style="background:rgba(15,157,138,.07);border:1px solid rgba(15,157,138,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--tx);margin-bottom:14px;line-height:1.5">
      </div>

      <div style="margin-bottom:14px">
        <input type="file" id="imp_file" accept=".csv,text/csv,text/plain" style="display:none">
        <button type="button" class="btn sec" id="imp_pick_btn" style="width:100%;justify-content:center;padding:12px;border:2px dashed var(--bd);background:var(--card);font-weight:600">
          📁 Seleccionar archivo CSV o TXT
        </button>
        <div id="imp_file_info" style="font-size:12px;color:var(--mut);margin-top:6px;text-align:center"></div>
      </div>

      <div id="imp_preview_box" style="display:none;flex:1;overflow-y:auto;max-height:240px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:16px">
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn sec" id="imp_cancel">Cancelar</button>
        <button type="button" class="btn" id="imp_submit" disabled>Confirmar e Importar</button>
      </div>
    </div>
  `;

  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector('#imp_close').onclick = close;
  m.querySelector('#imp_cancel').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };

  const updateGuide = () => {
    const g = m.querySelector('#imp_guide');
    if (impType === 'muestras') {
      g.innerHTML = `
        <strong>Formato de Muestras:</strong> Archivo CSV o TXT tipo lista simple donde cada fila contiene el nombre de una muestra médica.<br>
        <code style="background:var(--card);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;font-size:11px">Ejemplo: Prokal Qx</code>
      `;
    } else {
      g.innerHTML = `
        <strong>Formato de Productos:</strong> Archivo CSV con 2 columnas/espacios (1ra: <strong>Cod.</strong> y 2da: <strong>Producto</strong>), separados por coma, punto y coma, tabulador o espacios.<br>
        <code style="background:var(--card);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;font-size:11px">Ejemplo: 001, Prokal Proteína 500g &nbsp;|&nbsp; PK-02; Prokal Fibra</code>
      `;
    }
  };

  const parseAndRender = () => {
    if (!rawFileContent) return;
    const lines = rawFileContent.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    parsedItems = [];

    if (impType === 'muestras') {
      for (const line of lines) {
        let val = line.replace(/^["']|["']$/g, '').trim();
        if (val.includes(',') || val.includes(';')) {
          val = val.split(/[,;]/)[0].trim().replace(/^["']|["']$/g, '');
        }
        const low = val.toLowerCase();
        if (['muestra','muestras','producto','productos','nombre','item','items','descripcion'].includes(low)) {
          continue;
        }
        if (val && !parsedItems.includes(val)) {
          parsedItems.push(val);
        }
      }
    } else {
      for (const line of lines) {
        let cod = '', nom = '';
        if (line.includes('\t')) {
          const p = line.split('\t').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(' ').trim();
        } else if (line.includes(';')) {
          const p = line.split(';').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(';').trim();
        } else if (line.includes(',')) {
          const p = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(',').trim();
        } else if (line.includes('|')) {
          const p = line.split('|').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join('|').trim();
        } else {
          const match = line.match(/^(\S+)\s+(.+)$/);
          if (match) {
            cod = match[1].replace(/^["']|["']$/g, '').trim();
            nom = match[2].replace(/^["']|["']$/g, '').trim();
          } else {
            nom = line.replace(/^["']|["']$/g, '').trim();
          }
        }
        const cLow = cod.toLowerCase(), nLow = nom.toLowerCase();
        if (['cod','cod.','codigo','code','id'].includes(cLow) && ['producto','nombre','descripcion','desc','name','item'].includes(nLow)) {
          continue;
        }
        if (!nom && cod) { nom = cod; cod = ''; }
        if (nom) {
          if (!parsedItems.some(x => x.nombre.toLowerCase() === nom.toLowerCase())) {
            parsedItems.push({ codigo: cod, nombre: nom });
          }
        }
      }
    }

    const pBox = m.querySelector('#imp_preview_box');
    const btnSub = m.querySelector('#imp_submit');

    if (!parsedItems.length) {
      pBox.style.display = 'block';
      pBox.innerHTML = '<div style="color:var(--dg);text-align:center;padding:12px">⚠️ No se encontraron elementos válidos con el formato seleccionado.</div>';
      btnSub.disabled = true;
      btnSub.textContent = 'Confirmar e Importar';
      return;
    }

    pBox.style.display = 'block';
    if (impType === 'muestras') {
      pBox.innerHTML = `
        <div style="font-size:12px;color:var(--mut);margin-bottom:8px"><strong>${parsedItems.length}</strong> muestra(s) lista(s) para importar:</div>
        <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.7">
          ${parsedItems.map(it => `<li><b>${esc(it)}</b></li>`).join('')}
        </ol>
      `;
    } else {
      pBox.innerHTML = `
        <div style="font-size:12px;color:var(--mut);margin-bottom:8px"><strong>${parsedItems.length}</strong> producto(s) listo(s) para importar (Cod. | Producto):</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <thead>
            <tr style="border-bottom:1px solid var(--bd);text-align:left">
              <th style="padding:4px 8px;width:100px">Cod.</th>
              <th style="padding:4px 8px">Producto</th>
            </tr>
          </thead>
          <tbody>
            ${parsedItems.map(it => `
              <tr style="border-bottom:1px solid rgba(0,0,0,.05)">
                <td style="padding:4px 8px"><span class="badge" style="background:rgba(15,157,138,.12);color:var(--ac);font-family:monospace">${esc(it.codigo || '—')}</span></td>
                <td style="padding:4px 8px"><b>${esc(it.nombre)}</b></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    btnSub.disabled = false;
    btnSub.textContent = `Confirmar e Importar (${parsedItems.length} ${impType === 'muestras' ? 'muestras' : 'productos'})`;
  };

  updateGuide();

  m.querySelector('#imp_tab_mue').onclick = () => {
    impType = 'muestras';
    m.querySelector('#imp_tab_mue').classList.add('on');
    m.querySelector('#imp_tab_prd').classList.remove('on');
    updateGuide();
    parseAndRender();
  };
  m.querySelector('#imp_tab_prd').onclick = () => {
    impType = 'productos';
    m.querySelector('#imp_tab_prd').classList.add('on');
    m.querySelector('#imp_tab_mue').classList.remove('on');
    updateGuide();
    parseAndRender();
  };

  const fInput = m.querySelector('#imp_file');
  m.querySelector('#imp_pick_btn').onclick = () => fInput.click();
  fInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    m.querySelector('#imp_file_info').textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    const reader = new FileReader();
    reader.onload = evt => {
      rawFileContent = evt.target.result;
      parseAndRender();
    };
    reader.readAsText(file);
  };

  m.querySelector('#imp_submit').onclick = async () => {
    const btn = m.querySelector('#imp_submit');
    btn.disabled = true;
    btn.textContent = 'Importando…';
    try {
      const targetTipo = (impType === 'muestras') ? 'muestra' : 'producto';
      const res = await api('/api/catalogs/bulk', {
        method: 'POST',
        body: { tipo: targetTipo, items: parsedItems }
      });
      close();
      toast(`✅ Importación completada: ${res.added} nuevos elementos agregados (${res.total - res.added} actualizados o existentes)`);
      vConfig('producto', impType);
    } catch (err) {
      toast(err.message, 1);
      btn.disabled = false;
      btn.textContent = `Confirmar e Importar (${parsedItems.length})`;
    }
  };
}

// ---------- Notificaciones Web Push y Alertas de Actividades ----------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function getPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  if (Notification.permission !== 'granted') return 'prompt';
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return sub ? 'subscribed' : 'prompt';
  } catch {
    return 'unsupported';
  }
}

async function subscribePush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      toast('Las notificaciones Push no son soportadas en este navegador', 1);
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      toast('Permiso de notificaciones denegado', 1);
      return false;
    }
    const { publicKey } = await api('/api/push/vapid-key');
    if (!publicKey) {
      toast('Push VAPID no disponible en servidor', 1);
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }
    const subJson = sub.toJSON();
    await api('/api/push/subscribe', {
      method: 'POST',
      body: {
        endpoint: sub.endpoint,
        keys: {
          p256dh: subJson.keys?.p256dh,
          auth: subJson.keys?.auth
        }
      }
    });
    toast('🔔 Notificaciones de recordatorios activadas correctamente');
    return true;
  } catch (err) {
    console.error('Error al suscribir a push:', err);
    toast('Error activando notificaciones: ' + err.message, 1);
    return false;
  }
}

async function unsubscribePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await api('/api/push/subscribe', { method: 'DELETE', body: { endpoint: sub.endpoint } });
      await sub.unsubscribe();
    }
    toast('Notificaciones desactivadas en este equipo');
    return true;
  } catch (err) {
    toast('Error al desactivar: ' + err.message, 1);
    return false;
  }
}

        </p>
        <div style="font-size:13px;color:var(--mut);line-height:1.5">
          <div>📅 <strong>Fecha:</strong> ${dtStr}</div>
          ${ev.medico_ref ? `<div>👨‍⚕️ <strong>Médico:</strong> ${esc(ev.medico_ref)}</div>` : ''}
          ${ev.ubicacion ? `<div>📍 <strong>Lugar:</strong> ${esc(ev.ubicacion)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn sec" id="btn_alert_later">Recordar más tarde</button>
        <button class="btn sec dg" id="btn_alert_dismiss">Descartar</button>
        <button class="btn" id="btn_alert_go">📅 Ir a actividades agendadas</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
  activeAlertModal = modal;

  const closeAlert = () => {
    if (activeAlertModal) {
      activeAlertModal.remove();
      activeAlertModal = null;
    }
  };

  $('#btn_alert_later').onclick = () => {
    snoozedAlertIds.add(ev.id);
    setTimeout(() => snoozedAlertIds.delete(ev.id), 10 * 60 * 1000); // 10 min
    closeAlert();
  };

  $('#btn_alert_dismiss').onclick = async () => {
    try {
      await api(`/api/events/alerts/dismiss/${ev.id}`, { method: 'POST' });
    } catch {}
    closeAlert();
  };

  $('#btn_alert_go').onclick = async () => {
    try {
      await api(`/api/events/alerts/dismiss/${ev.id}`, { method: 'POST' });
    } catch {}
    closeAlert();
    go('agendar');
  };
}

async function checkActivityAlerts() {
  if (!me) return;
  try {
    const res = await api('/api/events/alerts');
    if (res.alerts && res.alerts.length > 0) {
      showActivityReminderAlert(res.alerts[0]);
    }
  } catch {}
}

// ---------- Registro de Service Worker y Eventos de Conectividad ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('Service Worker registrado:', reg.scope);
      checkActivityAlerts();
    }).catch(err => {
      console.warn('Error registrando Service Worker:', err);
    });
  });

  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'TRIGGER_SYNC') {
      checkPendingAndSync();
    }
    if (e.data && e.data.type === 'PUSH_REMINDER') {
      checkActivityAlerts();
    }
  });
}

window.addEventListener('online', () => {
  updateNetStatus();
  toast('🟢 Cobertura restablecida. Sincronizando datos...');
  checkPendingAndSync();
  checkActivityAlerts();
});

window.addEventListener('offline', () => {
  updateNetStatus();
  toast('🟠 Sin conexión a internet. Modo offline activado.', 1);
});

setInterval(checkPendingAndSync, 20000);
setInterval(checkActivityAlerts, 45000); // Revisar alertas de agenda cada 45 segundos

boot();
</script>
</body>
</html>
