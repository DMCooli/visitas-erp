<body>
<div id="root"></div><div id="toast"></div>
<script>
const $ = s => document.querySelector(s), root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.style.background = err ? 'var(--dg)' : ''; t.style.color = err ? '#fff' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); };
let isAuthRedirecting = false;

// ---------- Dispositivos y Autenticación Offline (Opción 2 + 3) ----------
function getDeviceId() {
  let did = localStorage.getItem('visitas_device_id');
  if (!did) {
    did = 'dev_' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36)));
    localStorage.setItem('visitas_device_id', did);
  }
  return did;
}

function getDeviceFriendlyName() {
  const ua = navigator.userAgent;
  let os = 'Dispositivo';
  if (/android/i.test(ua)) os = 'Android';
  else if (/iPhone/i.test(ua)) os = 'iPhone';
  else if (/iPad/i.test(ua)) os = 'iPad';
  else if (/Macintosh|Mac OS/i.test(ua)) os = 'Mac';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Linux/i.test(ua)) os = 'Linux';

  let browser = 'Navegador';
  if (/Chrome/i.test(ua) && !/Edg|OPR/i.test(ua)) browser = 'Chrome';
  else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
  else if (/Firefox/i.test(ua)) browser = 'Firefox';
  else if (/Edg/i.test(ua)) browser = 'Edge';

  return `${browser} en ${os}`;
}

async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const data = enc.encode((pin || '') + ':' + (salt || ''));
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function isBiometricAvailable() {
  if (!window.PublicKeyCredential) return false;
  try {
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  } catch (e) { return false; }
}

async function registerBiometrics(userId, email) {
  if (!window.PublicKeyCredential) throw new Error('Biometría no soportada en este navegador');
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'Visitas Medicas ERP', id: location.hostname },
      user: {
        id: new TextEncoder().encode(String(userId || 1)),
        name: email,
        displayName: email
      },
      pubKeyCredParams: [
        { type: 'public-key', alg: -7 },  // ES256
        { type: 'public-key', alg: -257 } // RS256
      ],
      authenticatorSelection: {
        authenticatorAttachment: 'platform',
        userVerification: 'preferred'
      },
      timeout: 60000
    }
  });
  if (!cred) throw new Error('No se pudo registrar la biometría');
  return btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
}

async function verifyBiometrics(rawIdBase64) {
  if (!window.PublicKeyCredential) throw new Error('Biometría no disponible');
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  let allowCredentials = [];
  if (rawIdBase64) {
    try {
      allowCredentials = [{
        type: 'public-key',
        id: Uint8Array.from(atob(rawIdBase64), c => c.charCodeAt(0))
      }];
    } catch (e) {}
  }
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge,
      rpId: location.hostname,
      allowCredentials,
      userVerification: 'required',
      timeout: 60000
    }
  });
  return !!assertion;
}

const api = async (u, o = {}) => {
  try {
    const headers = { 'Content-Type': 'application/json', ...(o.headers || {}) };
    const did = getDeviceId();
    if (did) headers['x-device-id'] = did;

    const r = await fetch(u, { method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined });
    const d = await r.json().catch(() => ({}));

    if (r.status === 403 && d.code === 'DEVICE_REVOKED') {
      try { await dbSaveCache('device_binding', null); } catch {}
      try { await dbSaveCache('me', null); } catch {}
      me = null;
      toast('Este dispositivo ha sido revocado o desvinculado por un administrador.', 1);
      loginScreen();
      const err = new Error(d.error || 'Dispositivo revocado');
      err.status = 403;
      throw err;
    }

    if (r.status === 401) {
      const err = new Error(d.error || 'No autenticado');
      err.status = 401;
      // NUNCA hacer location.reload() en 401 para evitar bucle infinito de recargas continuas
      if (me && !isAuthRedirecting) {
        isAuthRedirecting = true;
        me = null;
        try { await dbSaveCache('me', null); } catch {}
        loginScreen();
        setTimeout(() => { isAuthRedirecting = false; }, 1000);
      }
      throw err;
    }
    if (!r.ok) {
      const err = new Error(d.error || 'Error en petición');
      err.status = r.status;
      throw err;
    }
    return d;
  } catch (err) {
    if (!navigator.onLine || err.message.includes('fetch') || err.message.includes('Network') || err.message.includes('Load failed')) {
      const netErr = new Error('NETWORK_OFFLINE');
      netErr.isOffline = true;
      throw netErr;
    }
    throw err;
  }
};

// ---------- Almacenamiento Local Offline (IndexedDB) ----------
const DB_NAME = 'visitas_erp_offline';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('outbox')) {
        db.createObjectStore('outbox', { keyPath: 'client_uuid' });
      }
      if (!db.objectStoreNames.contains('cache')) {
        db.createObjectStore('cache', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbSaveOutbox(item) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outbox', 'readwrite');
    tx.objectStore('outbox').put(item);
    tx.oncomplete = () => resolve(true);
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGetOutbox() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('outbox', 'readonly');
      const req = tx.objectStore('outbox').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = e => reject(e.target.error);
    });
  } catch (e) { return []; }
}

async function dbRemoveOutbox(client_uuid) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('outbox', 'readwrite');
      tx.objectStore('outbox').delete(client_uuid);
      tx.oncomplete = () => resolve(true);
      tx.onerror = e => reject(e.target.error);
    });
  } catch (e) { return false; }
}

async function dbSaveCache(key, val) {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const tx = db.transaction('cache', 'readwrite');
      tx.objectStore('cache').put({ key, val, updated_at: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function dbGetCache(key) {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const tx = db.transaction('cache', 'readonly');
      const req = tx.objectStore('cache').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.val : null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

let isSyncing = false;

async function updateNetStatus(count, isSyncingNow) {
  const wrap = $('#net_pill_wrap');
  if (!wrap) return;
  if (count === undefined) {
    try {
      const pending = await dbGetOutbox();
      count = pending.length;
    } catch (e) { count = 0; }
  }
  const isOnline = navigator.onLine;

  let bg, col, dotCol, text, title;
  if (isSyncingNow) {
    bg = 'rgba(59,130,246,.18)'; col = '#60a5fa'; dotCol = '#3b82f6';
    text = `🔄 Sincronizando (${count})…`;
    title = 'Enviando visitas al servidor...';
  } else if (count > 0) {
    bg = 'rgba(245,158,11,.18)'; col = '#fbbf24'; dotCol = '#f59e0b';
    text = `📱 ${count} pendiente${count > 1 ? 's' : ''}`;
    title = `${count} visita(s) guardada(s) localmente. Clic para sincronizar.`;
  } else if (!isOnline) {
    bg = 'rgba(239,68,68,.18)'; col = '#f87171'; dotCol = '#ef4444';
    text = '🟠 Sin conexión';
    title = 'Modo offline activo. Puedes seguir trabajando con normalidad.';
  } else {
    bg = 'rgba(16,185,129,.18)'; col = '#34d399'; dotCol = '#10b981';
    text = '🟢 En línea';
    title = 'Conectado al servidor central';
  }

  wrap.innerHTML = `
    <div id="btn_net_status" title="${title}" style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:${bg};color:${col};cursor:pointer;border:1px solid rgba(255,255,255,.1);transition:all .2s">
      <span style="width:7px;height:7px;border-radius:50%;background:${dotCol};display:inline-block"></span>
      <span>${text}</span>
    </div>
  `;
  const btn = $('#btn_net_status');
  if (btn) btn.onclick = () => {
    if (count > 0 && navigator.onLine) {
      toast('Sincronizando visitas pendientes...');
      checkPendingAndSync();
    } else if (count > 0 && !navigator.onLine) {
      toast(`Tienes ${count} visita(s) guardada(s) en este dispositivo esperando cobertura.`, 1);
    } else if (!navigator.onLine) {
      toast('Sin conexión de red. Todas las visitas que registres se guardarán seguras en este dispositivo.', 0);
    } else {
      toast('Conectado en línea. El sistema está al día.', 0);
    }
  };
}

async function checkPendingAndSync() {
  const pending = await dbGetOutbox();
  updateNetStatus(pending.length);

  if (!pending.length) return;
  if (!navigator.onLine || isSyncing) return;

  try {
    const ping = await fetch('/api/ping', { cache: 'no-store' }).then(r => r.json());
    if (!ping || !ping.ok) return;
  } catch (e) {
    return;
  }

  isSyncing = true;
  updateNetStatus(pending.length, true);

  let synced = 0;
  for (const item of pending) {
    try {
      const res = await api('/api/visits', {
        method: 'POST',
        body: {
          ...item.body,
          client_uuid: item.client_uuid,
          fecha_offline: item.fecha_offline,
          is_offline: true
        }
      });
      if (res && res.ok) {
        await dbRemoveOutbox(item.client_uuid);
        synced++;
      }
    } catch (err) {
      console.warn('Error sincronizando visita offline:', err);
      if (err.isOffline) break;
    }
  }

  isSyncing = false;
  const remaining = await dbGetOutbox();
  updateNetStatus(remaining.length);

  if (synced > 0) {
    toast(`¡${synced} visita${synced > 1 ? 's' : ''} sincronizada${synced > 1 ? 's' : ''} con éxito al servidor!`);
    if (view === 'visitas') vVisitas();
    if (view === 'dash') vDash();
  }
}

async function boot() {
  let isOfflineMode = false;
  try {
    me = await api('/api/me');
    await dbSaveCache('me', me);
    checkAndEnrollDeviceOnline(me);
  } catch (e) {
    if (e && e.isOffline) {
      isOfflineMode = true;
      const binding = await dbGetCache('device_binding');
      if (binding && binding.user) {
        if (binding.isTrusted && !binding.requireManualUnlock && !binding.pinHash && !binding.hasBiometrics) {
          // Dispositivo de confianza total sin PIN ni biometría
          me = binding.user;
          toast('📱 Modo Offline: Dispositivo de confianza vinculado', 0);
          return finishBoot(true);
        } else if (binding.isTrusted && !binding.requireManualUnlock) {
          // Dispositivo de confianza con auto-login
          me = binding.user;
          toast('📱 Modo Offline: Dispositivo de confianza vinculado', 0);
          return finishBoot(true);
        } else {
          // Requiere desbloqueo
          return renderOfflineUnlockScreen(binding);
        }
      } else {
        return renderNoDeviceOfflineScreen();
      }
    } else {
      me = null;
      try { await dbSaveCache('me', null); } catch {}
    }
  }
  if (!me) return loginScreen();
  return finishBoot(false);
}

      user: { id: user.id, nombre: user.nombre, email: user.email, rol: user.rol, admin: user.admin, can_view_logs: user.can_view_logs },
      isTrusted,
      hasBiometrics: hasBioActive,
      bioCredId: tempBioId,
      pinHash,
      pinSalt,
      updatedAt: Date.now()
    };

    try {
      await api('/api/devices/bind', {
        method: 'POST',
        body: {
          deviceId: did,
          deviceName: dname,
          isTrusted,
          hasBiometrics: hasBioActive,
          hasPin: !!pinHash
        }
      });
      await dbSaveCache('device_binding', binding);

      close();
      toast('📱 Dispositivo vinculado exitosamente para acceso sin conexión');
      if (onSuccess) onSuccess();
    } catch (e) {
      errEl.textContent = e.message || 'Error guardando vinculación';
    }
  };
}

async function checkAndEnrollDeviceOnline(user) {
  const did = getDeviceId();
  const dname = getDeviceFriendlyName();
  let binding = await dbGetCache('device_binding');

  if (!binding || binding.userId !== user.id) {
    // Si no está vinculado aún, abrir automáticamente el modal de vinculación tras un breve retraso
    setTimeout(() => openDeviceEnrollmentModal(user, false), 800);
  } else {
    // Actualizar datos del usuario y sincronizar con servidor
    binding.user = { id: user.id, nombre: user.nombre, email: user.email, rol: user.rol, admin: user.admin, can_view_logs: user.can_view_logs };
    await dbSaveCache('device_binding', binding);
    api('/api/devices/bind', {
      method: 'POST',
      body: {
        deviceId: did,
        deviceName: dname,
        isTrusted: !!binding.isTrusted,
        hasBiometrics: !!binding.hasBiometrics,
        hasPin: !!binding.pinHash
      }
    }).catch(() => {});
  }
}

  let allUsers = [], filterUserId = '';

  if (isA) {

  function fmtDT(dt) {
    if (!dt) return '—';
    return new Date(dt).toLocaleString('es-VE', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function fmtTime(dt) {
    if (!dt) return '';
    return new Date(dt).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' });
  }
  function toLocalInput(dt) {
    if (!dt) return '';
    const d = new Date(dt), pad = n => String(n).padStart(2,'0');

  async function render() {
    const [events, sum] = await Promise.all([fetchEvents(), fetchSummary()]);
    const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const DAYS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
    const prevDays = new Date(curYear, curMonth, 0).getDate();
    const today = new Date();
    const todayStr = today.toDateString();

    const evByDay = {};
    events.forEach(ev => {
      const d = new Date(ev.inicio);
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if (!evByDay[key]) evByDay[key] = [];
      evByDay[key].push(ev);
    });

    // Celdas del calendario
    let cells = '';
    for (let i = 0; i < firstDay; i++) {
      const day = prevDays - firstDay + i + 1;
      cells += `<div class="cal-cell other-month"><div class="cal-num">${day}</div></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = new Date(curYear, curMonth, d).toDateString() === todayStr;
      const key = `${curYear}-${curMonth}-${d}`;
      const dayEvs = evByDay[key] || [];
      const evHtml = dayEvs.slice(0,3).map(ev => {
        const isMine = ev.user_id === (me.id || 0);
        const col = ev.color || '#0f9d8a';
        return `<div class="cal-ev${!isMine?' other-user':''}" style="background:${col}" data-evid="${ev.id}" title="${esc(ev.titulo)}${ev.user_nombre?' ('+esc(ev.user_nombre)+')':''}">${esc(ev.titulo)}</div>`;
      }).join('') + (dayEvs.length > 3 ? `<div style="font-size:10px;font-weight:700;color:var(--ac)">+${dayEvs.length-3} más</div>` : '');
      cells += `<div class="cal-cell${isToday?' today':''}" data-day="${d}">
        <div class="cal-num">${d}</div>${evHtml}</div>`;
    }
    const total = firstDay + daysInMonth;
    const rem = (7 - (total % 7)) % 7;
    for (let i = 1; i <= rem; i++) cells += `<div class="cal-cell other-month"><div class="cal-num">${i}</div></div>`;

    // Vista Agenda (Lista)
    let agendaHtml = '';
    if (events.length === 0) {
      agendaHtml = '<div class="card" style="text-align:center;padding:30px;color:var(--mut)">No hay actividades agendadas en este período. Presione "+ Agendar Actividad" para programar una.</div>';
    } else {
      agendaHtml = events.map(ev => {
        const col = ev.color || '#0f9d8a';
        const cat = getCatMeta(ev.categoria);
        const isMine = ev.user_id === (me.id || 0);
        return `
          <div class="cal-agenda-row" data-evid="${ev.id}" style="border-left:5px solid ${col};cursor:pointer">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span class="cal-pill" style="background:${col}">${cat.icon} ${cat.label}</span>
                <span style="font-size:12px;font-weight:700;color:var(--tx)">${fmtDT(ev.inicio)}</span>
                ${ev.recordatorio_min >= 0 ? `<span style="font-size:11px;color:var(--mut);display:inline-flex;align-items:center;gap:3px">🔔 Alerta activa</span>` : ''}
              </div>
              <div style="font-size:15px;font-weight:700;color:var(--tx)">${esc(ev.titulo)}</div>
              <div style="font-size:13px;color:var(--mut);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap">
                ${ev.medico_ref ? `<span>👨‍⚕️ ${esc(ev.medico_ref)}</span>` : ''}
                ${ev.ubicacion ? `<span>📍 ${esc(ev.ubicacion)}</span>` : ''}
                ${isA && !isMine ? `<span style="color:var(--ac)">👤 ${esc(ev.user_nombre||ev.user_email)}</span>` : ''}
              </div>
            </div>
            <button class="btn sec sm" style="padding:5px 12px">Ver detalle</button>
          </div>
        `;
      }).join('');
    }

    // Estado Push
    const pStatus = await getPushStatus();
    let pushBtnLabel = '🔔 Activar Alertas en este equipo';
    let pushBtnClass = 'push-status-btn';
    if (pStatus === 'subscribed') {
      pushBtnLabel = '✅ Alertas Push Activadas';
      pushBtnClass = 'push-status-btn active';
    } else if (pStatus === 'denied') {
      pushBtnLabel = '🔕 Notificaciones bloqueadas';
    }

    main.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div>
          <h1 style="margin:0;display:inline-flex;align-items:center;gap:8px">📅 Agendar</h1>
          <p style="margin:2px 0 0;font-size:13px;color:var(--mut)">Sistema de agenda propia con recordatorios y alertas automáticas</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${isA ? `<select id="cal_user_filter" style="width:auto;padding:7px 10px;font-size:13px">
            <option value="">Todos los usuarios</option>
            ${allUsers.map(u => `<option value="${u.id}" ${filterUserId==u.id?'selected':''}>${esc(u.nombre||u.email)}</option>`).join('')}
          </select>` : ''}
          <button class="${pushBtnClass}" id="btn_toggle_push" title="Recibir recordatorios aunque la aplicación esté en segundo plano">${pushBtnLabel}</button>
          <button class="btn" id="cal_new_ev">+ Agendar Actividad</button>
        </div>
      </div>

      <!-- Barra de métricas de agenda -->
      <div class="cal-kpis">
        <div class="cal-kpi-card">
          <span class="val">${sum.total}</span>
          <span class="lbl">Total Registradas</span>
        </div>
        <div class="cal-kpi-card ${sum.hoy > 0 ? 'highlight' : ''}">
          <span class="val">${sum.hoy}</span>
          <span class="lbl">Para Hoy</span>
        </div>
        <div class="cal-kpi-card ${sum.manana > 0 ? 'highlight' : ''}">
          <span class="val">${sum.manana}</span>
          <span class="lbl">Para Mañana</span>
        </div>
        <div class="cal-kpi-card">
          <span class="val">${sum.semana}</span>
          <span class="lbl">Próximos 7 Días</span>
        </div>
      </div>

      <!-- Pestañas de vista y controles de navegación -->
      <div class="card" style="padding:12px;margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div class="cal-tabs">
            <button class="cal-tab ${calCurrentView==='month'?'active':''}" id="tab_view_month">📅 Calendario</button>
            <button class="cal-tab ${calCurrentView==='agenda'?'active':''}" id="tab_view_agenda">📋 Lista de Actividades</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="btn sec sm" id="cal_prev">&lsaquo; Anterior</button>
            <button class="btn sec sm" id="cal_today">Hoy</button>
            <h2 style="margin:0;font-size:16px;min-width:140px;text-align:center">${MONTHS[curMonth]} ${curYear}</h2>
            <button class="btn sec sm" id="cal_next">Siguiente &rsaquo;</button>
          </div>
        </div>
      </div>

      <!-- Contenido según la vista seleccionada -->
      ${calCurrentView === 'month' ? `
        <div class="cal-wrap card" style="padding:14px">
          <div class="cal-grid">${DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}${cells}</div>
        </div>
      ` : `
        <div class="cal-agenda-wrap">
          ${agendaHtml}
        </div>
      `}
    `;

    // Event handlers
    $('#tab_view_month').onclick = () => { calCurrentView = 'month'; render(); };
    $('#tab_view_agenda').onclick = () => { calCurrentView = 'agenda'; render(); };

    $('#cal_prev').onclick  = () => { curMonth--; if (curMonth < 0) { curMonth=11; curYear--; } render(); };
    $('#cal_next').onclick  = () => { curMonth++; if (curMonth > 11) { curMonth=0; curYear++; } render(); };
    $('#cal_today').onclick = () => { curYear = today.getFullYear(); curMonth = today.getMonth(); render(); };

    $('#cal_new_ev').onclick = () => openEventModal();

    if (isA && $('#cal_user_filter')) {
      $('#cal_user_filter').onchange = e => { filterUserId = e.target.value; render(); };
    }

    // Push toggle
    $('#btn_toggle_push').onclick = async () => {
      const cur = await getPushStatus();
      if (cur === 'subscribed') {
        if (confirm('¿Desea desactivar las notificaciones push en este dispositivo?')) {
          await unsubscribePush();
          render();
        }
      } else {
        const ok = await subscribePush();
        if (ok) render();
      }
    };

    // Clic en celdas para agendar en ese día
    document.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
      cell.onclick = e => {
        if (e.target.closest('.cal-ev')) return;
        const d = parseInt(cell.dataset.day);
        openEventModal(null, new Date(curYear, curMonth, d));
      };
    });

    // Clic en evento para ver/editar
    document.querySelectorAll('[data-evid]').forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        const ev = events.find(v => v.id == el.dataset.evid);
        if (ev) openEventModal(ev);
      };
    });
  }

  render();
}

// ---------- Pedidos ----------
function orderStatusBadge(s) {
  const map = {
    enviado:   { label: 'Enviado a Planta', color: '#2563eb', bg: 'rgba(37,99,235,.12)' },
    revision:  { label: 'En Revisión',      color: '#d97706', bg: 'rgba(217,119,6,.12)' },
    aprobado:  { label: 'Aprobado',         color: '#059669', bg: 'rgba(5,150,105,.12)' },
    listo:     { label: 'Pedido Listo',     color: '#7c3aed', bg: 'rgba(124,58,237,.12)' },
    rechazado: { label: 'Rechazado',        color: '#dc2626', bg: 'rgba(220,38,38,.12)' }
  };
  const st = map[s] || { label: s || '—', color: 'var(--mut)', bg: 'rgba(0,0,0,.06)' };
  return `<span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:${st.color};background:${st.bg}">${st.label}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('es-VE', { day:'2-digit', month:'2-digit', year:'numeric' });
}

async function vPedidos(tab, selectedVisitadorId = null) {
  // Asegurar que los catálogos de muestras y productos estén cargados desde la base de datos
  if (!cat.muestra?.length && !cat.producto?.length) {
    try {
      const c = await api('/api/catalogs');
      cat.institucion = c.institucion || [];
      cat.especialidad = c.especialidad || [];
      cat.muestra = c.muestra || [];
      cat.producto = c.producto || [];
    } catch(e) {}
  }

  if (!me.admin) tab = 'pedidos';
  else if (!tab) tab = 'solicitudes';

  const main = $('#main');
  const availableTabs = me.admin
    ? [['solicitudes','📋 Solicitudes'],['gestion','⚙️ Gestión de Pedidos'],['pedidos','📦 Pedidos']]
    : [['pedidos','📦 Mis Pedidos']];

  main.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div>
        <h1 style="margin:0;display:inline-flex;align-items:center;gap:8px">📦 Pedidos</h1>
        <p style="margin:2px 0 0;font-size:13px;color:var(--mut)">Gestión y seguimiento de pedidos de muestras y productos registrados</p>
      </div>
    </div>
    <div class="tabs" id="ped_tabs">
      ${availableTabs.map(([k,l]) => `<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}
    </div>
    <div id="ped_body"></div>
    <!-- MODAL GENERAL PARA PEDIDOS -->
    <div id="p_modal" class="modal" style="display:none;z-index:900">
      <div class="card" style="max-width:760px;width:100%;margin:auto" id="p_modal_inner"></div>
    </div>
  `;

  document.querySelectorAll('#ped_tabs button').forEach(b => {
    b.onclick = () => vPedidos(b.dataset.t);
  });

  const body = $('#ped_body');

  // Helper para renderizar items en tablas
  const renderItemsListHtml = (items) => {
    if (!items || !items.length) return '<span style="color:var(--mut)">Sin ítems</span>';
    return `<div style="font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:3px">
      ${items.map(it => `
        <div>
          <span style="font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:${it.tipo==='muestra'?'rgba(15,157,138,.12)':'rgba(59,130,246,.12)'};color:${it.tipo==='muestra'?'var(--ac)':'#2563eb'}">${it.tipo==='muestra'?'MUESTRA':'PRODUCTO'}</span>
          <strong>${esc(it.nombre)}</strong>
          <span style="color:var(--tx);font-weight:600">(${it.cantidad_solicitada} uds)</span>
          ${it.rechazado ? '<span style="color:#ef4444;font-size:11px;margin-left:4px">❌ Rechazado</span>' : it.cantidad_aprobada !== null && it.cantidad_aprobada !== undefined ? `<span style="color:#10b981;font-size:11px;margin-left:4px">✓ ${it.cantidad_aprobada} aprobadas</span>` : ''}
        </div>
      `).join('')}
    </div>`;
  };

  const calcTotalQty = (items) => (items || []).reduce((acc, it) => acc + (it.cantidad_solicitada || 0), 0);

  // Helper para armar opciones del select según tipo
  const getCatalogOptionsHtml = (tipo, selectedId, selectedName) => {
    const list = tipo === 'producto' ? (cat.producto || []) : (cat.muestra || []);
    let options = '<option value="">— Seleccione de la lista registrada —</option>';
    let found = false;
    list.forEach(c => {
      const isSel = (selectedId && c.id == selectedId) || (selectedName && c.nombre === selectedName);
      if (isSel) found = true;
      const label = c.codigo ? `${c.codigo} — ${c.nombre}` : c.nombre;
      options += `<option value="${c.id}" data-nombre="${esc(c.nombre)}" ${isSel ? 'selected' : ''}>${esc(label)}</option>`;
    });
    // Si viene de un registro anterior que ya no esté en el catálogo activo
    if (!found && selectedName) {
      options += `<option value="" data-nombre="${esc(selectedName)}" selected>${esc(selectedName)} (no activo)</option>`;
    }
    return options;
  };

  // ========== TAB 1: SOLICITUDES (solo administradores) ==========
  if (tab === 'solicitudes') {
    body.innerHTML = `
      <div class="card" style="padding:16px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <label style="font-size:13px;font-weight:600;color:var(--mut)">Filtrar por Estado:</label>
          <select id="pf_status" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px">
            <option value="">Todos los estados</option>
            <option value="enviado">Enviado a Planta</option>
            <option value="revision">En Revisión</option>
            <option value="aprobado">Aprobado</option>
            <option value="listo">Pedido Listo</option>
            <option value="rechazado">Rechazado</option>
          </select>
          <button class="btn sm" id="pf_btn">Filtrar</button>
          <button class="btn sec sm" id="pf_clr">Limpiar</button>
        </div>
        <div id="sol_tbl" class="scroll"><div style="text-align:center;padding:30px;color:var(--mut)">Cargando solicitudes…</div></div>
      </div>
    `;

    async function loadSolicitudes() {
      const st = $('#pf_status').value;
      const url = '/api/orders' + (st ? '?status=' + st : '');
      try {
        const rows = await api(url);
        const tbl = $('#sol_tbl');
        if (!rows.length) {
          tbl.innerHTML = '<p style="color:var(--mut);text-align:center;padding:24px">No hay solicitudes registradas con este criterio.</p>';
          return;
        }
        tbl.innerHTML = `<table>
          <thead>
            <tr>
              <th>Fecha Solicitud</th>
              <th>Visitador</th>
              <th>Médico / Destinatario</th>
              <th>Producto o Muestra</th>
              <th style="text-align:center">Total Cant.</th>
              <th>Fecha Entrega</th>
              <th>Estatus</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(o => `
              <tr>
                <td style="white-space:nowrap">${fmtDate(o.fecha_solicitud)}</td>
                <td><strong>${esc(o.visitador_nombre || o.visitador_email)}</strong></td>
                <td>${esc(o.medico)}</td>
                <td>${renderItemsListHtml(o.items)}</td>
                <td style="text-align:center"><span class="badge" style="font-size:12px">${calcTotalQty(o.items)}</span></td>
                <td style="white-space:nowrap">${fmtDate(o.fecha_entrega)}</td>
                <td>${orderStatusBadge(o.status)}</td>
                <td style="white-space:nowrap">
                  <button class="btn sm" data-oid="${o.id}" data-act="sol_ver">Ver</button>
                  <button class="btn sm sec" data-vid="${o.visitador_id}" data-act="sol_gestionar" style="margin-left:4px" title="Ir a Gestión de Pedidos">Gestionar</button>
                  ${o.status === 'enviado' ? `<button class="btn sm" style="background:#d97706;color:#fff;margin-left:4px" data-oid="${o.id}" data-act="sol_tomar">Tomar</button>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;

        tbl.querySelectorAll('[data-act="sol_ver"]').forEach(b => {
          b.onclick = () => openOrderDetail(+b.dataset.oid, 'solicitudes');
        });
        tbl.querySelectorAll('[data-act="sol_gestionar"]').forEach(b => {
          b.onclick = () => vPedidos('gestion', +b.dataset.vid);
        });
        tbl.querySelectorAll('[data-act="sol_tomar"]').forEach(b => {
          b.onclick = async () => {
            if (!confirm('¿Tomar este pedido para revisión?')) return;
            try {
              await api('/api/orders/' + b.dataset.oid + '/process', { method: 'POST', body: { action: 'tomar' } });
              toast('Pedido tomado. Estado cambiado a "En Revisión".');
              loadSolicitudes();
            } catch(e) { toast(e.message, 1); }
          };
        });
      } catch(e) {
        $('#sol_tbl').innerHTML = `<p style="color:var(--err)">Error: ${esc(e.message)}</p>`;
      }
    }

    $('#pf_btn').onclick = loadSolicitudes;
    $('#pf_clr').onclick = () => { $('#pf_status').value = ''; loadSolicitudes(); };
    loadSolicitudes();
  }

  // ========== TAB 2: GESTIÓN DE PEDIDOS (solo administradores) ==========
  else if (tab === 'gestion') {
    body.innerHTML = `
      <div class="card" style="padding:16px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
          <div class="fld" style="margin:0;min-width:280px">
            <label style="font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px">Seleccionar Visitador con pedidos activos:</label>
            <select id="g_vis" style="padding:8px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:14px;width:100%">
              <option value="">— Seleccione un visitador —</option>
            </select>
          </div>
          <button class="btn sec sm" id="g_refresh_vis" style="margin-top:18px">🔄 Actualizar</button>
        </div>
        <div id="g_orders">
          <p style="color:var(--mut);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--bd);border-radius:8px">
            👈 Seleccione un visitador en el desplegable superior para gestionar sus pedidos activos, aprobar cantidades y procesar las entregas.
          </p>
        </div>
      </div>
    `;

    async function loadVisitadoresDropdown() {
      try {
        const visitadores = await api('/api/orders/visitadores');
        const sel = $('#g_vis');
        sel.innerHTML = '<option value="">— Seleccione un visitador —</option>';
        visitadores.forEach(v => {
          const op = document.createElement('option');
          op.value = v.id;
          const activos = +v.pedidos_activos || 0;
          op.textContent = `${v.nombre || v.email} (${activos} ${activos === 1 ? 'pedido activo' : 'pedidos activos'})`;
          if (selectedVisitadorId && +v.id === +selectedVisitadorId) {
            op.selected = true;
          }
          sel.appendChild(op);
        });
        if (selectedVisitadorId) {
          sel.dispatchEvent(new Event('change'));
        }
      } catch(e) {
        toast('Error al cargar lista de visitadores: ' + e.message, 1);
      }

    $('#g_refresh_vis').onclick = loadVisitadoresDropdown;

    $('#g_vis').onchange = async function() {

        return;

      gord.innerHTML = '<p style="color:var(--mut);text-align:center;padding:20px">Cargando pedidos del visitador…</p>';

          gord.innerHTML = `
            <div style="text-align:center;padding:30px;color:var(--mut)">
              <div style="font-size:32px;margin-bottom:8px">✅</div>
              <strong>Este visitador no tiene pedidos activos pendientes de procesar.</strong>
              <p style="font-size:13px;margin-top:6px">Todos sus pedidos ya fueron marcados como listos o rechazados.</p>
            </div>
          `;
          return;
        }

        gord.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:18px">
            ${activos.map(o => `
              <div class="card" style="border:1px solid var(--bd);padding:16px;border-radius:10px;background:var(--bg)" id="gcard_${o.id}">
                <!-- CABECERA DEL PEDIDO -->
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--bd);padding-bottom:10px">
                  <div>
                    <h3 style="margin:0;font-size:16px;display:inline-flex;align-items:center;gap:8px">
                      <span>📦 Pedido #${o.id}</span>
                      ${orderStatusBadge(o.status)}
                      ${o.pending_edit ? '<span style="font-size:11px;background:rgba(245,158,11,.15);color:#d97706;padding:2px 8px;border-radius:10px;font-weight:600">⚠ Edición pendiente de aprobación</span>' : ''}
                    </h3>
                    <div style="font-size:13px;color:var(--mut);margin-top:4px">
                      Médico: <strong>${esc(o.medico)}</strong>
                    </div>
                  </div>
                  <div style="font-size:12px;color:var(--mut);text-align:right">
                    <div>Solicitado: <strong>${fmtDate(o.fecha_solicitud)}</strong></div>
                    <div>Fecha Entrega: <strong>${fmtDate(o.fecha_entrega)}</strong></div>

                ${o.notas ? `<div style="font-size:13px;padding:8px 12px;background:var(--bg2);border-radius:6px;margin-bottom:12px"><strong>Observaciones del visitador:</strong> ${esc(o.notas)}</div>` : ''}

                <!-- LISTA DE PRODUCTOS O MUESTRAS -->
                <div style="margin-bottom:14px">
                  <strong style="font-size:13px;color:var(--mut);display:block;margin-bottom:8px">Lista de Productos y Muestras del Pedido:</strong>
                  <div class="scroll">
                    <table style="font-size:13px" id="gtbl_${o.id}">
                      <thead>
                        <tr>
                          <th>Tipo</th>
                          <th>Producto / Muestra</th>
                          <th style="text-align:center">Cant. Solicitada</th>
                          <th style="width:140px">Cant. Aprobada / Asignada</th>
                          <th style="text-align:center;width:90px">¿Rechazar?</th>
                          <th>Motivo de Rechazo (si aplica)</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${(o.items || []).map(it => `
                          <tr id="git_row_${it.id}" style="${it.rechazado ? 'background:rgba(239,68,68,.06)' : ''}">
                            <td>
                              <span style="font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:${it.tipo==='muestra'?'rgba(15,157,138,.12)':'rgba(59,130,246,.12)'};color:${it.tipo==='muestra'?'var(--ac)':'#2563eb'}">${it.tipo.toUpperCase()}</span>
                            </td>
                            <td><strong>${esc(it.nombre)}</strong></td>
                            <td style="text-align:center;font-weight:600">${it.cantidad_solicitada}</td>
                            <td>
                              <input type="number" min="0" value="${it.cantidad_aprobada !== null && it.cantidad_aprobada !== undefined ? it.cantidad_aprobada : it.cantidad_solicitada}" data-iid="${it.id}" data-f="cant_ap" style="width:90px;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-weight:600">
                            </td>
                            <td style="text-align:center">
                              <input type="checkbox" data-iid="${it.id}" data-f="rech" ${it.rechazado ? 'checked' : ''} style="cursor:pointer;width:18px;height:18px">

                <!-- NOTAS Y BOTONES DE ACCIÓN DEL ADMINISTRADOR -->
                <div style="border-top:1px solid var(--bd);padding-top:12px;margin-top:12px">
                  <label class="fld" style="margin-bottom:12px">
                    <span style="font-size:12px;font-weight:600;color:var(--mut)">Observaciones del Administrador / Planta:</span>
                    <textarea id="g_admin_notas_${o.id}" rows="2" placeholder="Observaciones generales sobre este pedido…">${esc(o.admin_notas || '')}</textarea>
                  </label>
                  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                      ${o.status === 'enviado' ? `
                        <button class="btn sm" data-oid="${o.id}" data-act="g_tomar" style="background:#d97706;color:#fff">📥 Tomar en Revisión</button>

                      <button class="btn sm" data-oid="${o.id}" data-act="g_aprobar" style="background:var(--ac);color:var(--acx)">👍 Aprobar Cantidades</button>
                      <button class="btn sm" data-oid="${o.id}" data-act="g_listo" style="background:#7c3aed;color:#fff">✅ Marcar Pedido Listo (Listo para retiro)</button>
                    </div>
                    <button class="btn sm dg" data-oid="${o.id}" data-act="g_rechazar">🚫 Negar Pedido Completo</button>

              </div>

          </div>
        `;

        // Eventos de checkboxes para cambiar color de fila
        gord.querySelectorAll('[data-f="rech"]').forEach(chk => {
          chk.onchange = () => {
            const row = $(`#git_row_${chk.dataset.iid}`);
            if (row) {
              row.style.background = chk.checked ? 'rgba(239,68,68,.06)' : '';
            }
          };
        });

        // Eventos de botones de acción para cada pedido
        gord.querySelectorAll('[data-act^="g_"]').forEach(b => {
          b.onclick = async () => {
            const oid = +b.dataset.oid;
            const act = b.dataset.act;

            // Extraer items del formulario del pedido
            const getOrderItemsPayload = (orderId) => {
              const rows = document.querySelectorAll(`#gtbl_${orderId} [data-iid]`);
              const map = {};
              rows.forEach(inp => {
                const iid = inp.dataset.iid;
                if (!map[iid]) map[iid] = { id: +iid };
                if (inp.dataset.f === 'cant_ap') map[iid].cantidad_aprobada = +inp.value || 0;
                if (inp.dataset.f === 'rech') map[iid].rechazado = inp.checked;
                if (inp.dataset.f === 'razon') map[iid].razon_rechazo = inp.value.trim() || null;
              });
              return Object.values(map);
            };

            const adminNotas = ($(`#g_admin_notas_${oid}`)?.value || '').trim() || null;

            if (act === 'g_tomar') {
              try {
                await api(`/api/orders/${oid}/process`, { method: 'POST', body: { action: 'tomar' } });
                toast('Pedido tomado en revisión por administración.');
                $('#g_vis').dispatchEvent(new Event('change'));
              } catch(e) { toast(e.message, 1); }
            } else if (act === 'g_aprobar') {
              const items = getOrderItemsPayload(oid);
              try {
                await api(`/api/orders/${oid}/process`, {
                  method: 'POST',
                  body: { action: 'aprobar', admin_notas: adminNotas, items }
                });
                toast('Pedido y cantidades aprobadas correctamente. 👍');
                $('#g_vis').dispatchEvent(new Event('change'));
              } catch(e) { toast(e.message, 1); }
            } else if (act === 'g_listo') {
              const items = getOrderItemsPayload(oid);
              try {
                await api(`/api/orders/${oid}/process`, {
                  method: 'POST',
                  body: { action: 'listo', admin_notas: adminNotas, items }
                });
                toast('¡Pedido marcado como LISTO para su entrega! ✅');
                $('#g_vis').dispatchEvent(new Event('change'));
              } catch(e) { toast(e.message, 1); }
            } else if (act === 'g_rechazar') {
              const motivo = prompt('Indique el motivo u observación del rechazo total del pedido (requerido):');
              if (!motivo || !motivo.trim()) {
                toast('Debe ingresar un motivo para rechazar el pedido.', 1);
                return;
              }
              if (!confirm('¿Está seguro de negar y rechazar este pedido en su totalidad?')) return;
              try {
                await api(`/api/orders/${oid}/process`, {
                  method: 'POST',
                  body: { action: 'rechazar', admin_notas: motivo.trim() }
                });
                toast('Pedido rechazado en totalidad.');
                $('#g_vis').dispatchEvent(new Event('change'));
              } catch(e) { toast(e.message, 1); }
            }
          };
        });

      } catch(e) {
        gord.innerHTML = `<p style="color:var(--err);padding:20px">Error al cargar pedidos: ${esc(e.message)}</p>`;
      }
    };

    loadVisitadoresDropdown();
  }

  // ========== TAB 3: PEDIDOS (administradores y visitadores) ==========
  else if (tab === 'pedidos') {
    let usersForFilter = [];
    if (me.admin) {
      try { usersForFilter = await api('/api/users'); } catch(e) {}
    }

    let medicosList = [];
    try {
      medicosList = await api('/api/orders/medicos');
    } catch(e) {}

    body.innerHTML = `
      <!-- FORMULARIO NUEVA SOLICITUD DE PEDIDO -->
      <div class="card" style="padding:16px;margin-bottom:16px" id="pf_card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid var(--bd);padding-bottom:8px">
          <h3 style="margin:0;font-size:16px;display:flex;align-items:center;gap:6px">
            <span>➕ Nueva Solicitud de Pedido</span>
          </h3>
          <button class="btn sec sm" id="pf_toggle">Ocultar formulario</button>
        </div>

        <div id="pf_form_wrap">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px">
            <label class="fld">
              <span>Médico / Destinatario * (${medicosList.length} registrados)</span>
              <select id="pf_medico_sel" style="width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:13px" required>
                <option value="">— Seleccione médico registrado —</option>
                ${medicosList.map(m => {
                  const sub = [m.institucion, m.especialidad].filter(Boolean).join(' · ');
                  const visInfo = me.admin ? ` — 👤 Visitador: ${esc(m.visitador_nombre || m.visitador_email)}` : '';
                  return `<option value="${esc(m.medico)}" data-vid="${m.visitador_id}" data-vnom="${esc(m.visitador_nombre || m.visitador_email)}">${esc(m.medico)}${sub ? ' (' + esc(sub) + ')' : ''}${visInfo}</option>`;
                }).join('')}
                <option value="__manual__">➕ Escribir otro médico no registrado…</option>
              </select>
              <input id="pf_medico_manual" placeholder="Escriba el nombre completo del médico" style="display:none;margin-top:6px">
              <div id="pf_admin_vis_notice" style="display:none;margin-top:6px;font-size:12px;color:var(--ac);font-weight:600;padding:6px 10px;background:rgba(15,157,138,.1);border-radius:6px;border:1px solid rgba(15,157,138,.25)"></div>
            </label>
            <label class="fld">
              <span>Fecha de Solicitud *</span>
              <input type="date" id="pf_fecha_sol" value="${new Date().toISOString().split('T')[0]}" required>
            </label>
            <label class="fld">
              <span>Fecha Estimada de Entrega</span>
              <input type="date" id="pf_fecha_ent">
            </label>
          </div>

          <label class="fld" style="margin-bottom:14px">
            <span>Observaciones / Notas adicionales</span>
            <textarea id="pf_notas" rows="2" placeholder="Indicaciones para planta o empaque…"></textarea>
          </label>

          <!-- SECCIÓN DE PRODUCTOS O MUESTRAS DEL PEDIDO -->
          <div style="background:var(--bg2);padding:14px;border-radius:8px;border:1px solid var(--bd);margin-bottom:14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <div>
                <strong style="font-size:14px">Productos o Muestras a Solicitar</strong>
                <span style="font-size:12px;color:var(--mut);display:block">Seleccione los elementos ya registrados en el catálogo del sistema</span>
              </div>
              <button type="button" class="btn sm" id="pf_add_item" style="background:var(--ac);color:var(--acx)">+ Agregar producto/muestra</button>
            </div>
            <div id="pf_items_list"></div>
          </div>

          <button class="btn" id="pf_submit" style="padding:8px 24px;font-size:14px">
            📤 Enviar Pedido a Planta
          </button>
        </div>
      </div>

      <!-- TABLA DE PEDIDOS -->
      <div class="card" style="padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
          <h3 style="margin:0;font-size:16px">
            ${me.admin ? '📋 Historial de Todos los Pedidos' : '📋 Mis Pedidos Registrados'}
          </h3>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            ${me.admin ? `
              <select id="pt_vis" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px">
                <option value="">Todos los visitadores</option>
                ${usersForFilter.map(u => `<option value="${u.id}">${esc(u.nombre || u.email)}</option>`).join('')}
              </select>
            ` : ''}
            <select id="pt_status" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px">
              <option value="">Todos los estados</option>
              <option value="enviado">Enviado a Planta</option>
              <option value="revision">En Revisión</option>
              <option value="aprobado">Aprobado</option>
              <option value="listo">Pedido Listo</option>
              <option value="rechazado">Rechazado</option>
            </select>
            <button class="btn sm" id="pt_filtrar">Filtrar</button>
            <button class="btn sec sm" id="pt_limpiar">Limpiar</button>
          </div>
        </div>

        <div id="ped_tbl" class="scroll"><div style="text-align:center;padding:30px;color:var(--mut)">Cargando pedidos…</div></div>
      </div>
    `;

    // Manejo de selección de médico en el formulario
    const selMedico = $('#pf_medico_sel');
    const manMedico = $('#pf_medico_manual');
    const visNotice = $('#pf_admin_vis_notice');

    selMedico.onchange = () => {
      const val = selMedico.value;
      if (val === '__manual__') {
        manMedico.style.display = 'block';
        manMedico.focus();
        if (visNotice) visNotice.style.display = 'none';
      } else {
        manMedico.style.display = 'none';
        if (me.admin && visNotice) {
          const opt = selMedico.options[selMedico.selectedIndex];
          const vnom = opt ? opt.dataset.vnom : '';
          if (vnom && val) {
            visNotice.style.display = 'block';
            visNotice.innerHTML = `👤 Este pedido se registrará a nombre del visitador: <strong>${vnom}</strong>`;
          } else {
            visNotice.style.display = 'none';
          }
        }
      }
    };

    // Lista interactiva de items en el formulario
    let pedItems = [
      { tipo: 'muestra', catalogo_id: null, nombre: '', cantidad_solicitada: 1 }
    ];

    function renderPfItems() {
      const list = $('#pf_items_list');
      if (!pedItems.length) {
        list.innerHTML = '<p style="color:var(--mut);font-size:13px;margin:8px 0">No hay productos ni muestras agregadas. Haga clic en "+ Agregar producto/muestra".</p>';
        return;
      }
      list.innerHTML = pedItems.map((it, i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;background:var(--bg);padding:8px 10px;border-radius:6px;border:1px solid var(--bd)">
          <div style="width:120px">
            <select data-pi="${i}" data-f="tipo" style="width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px;font-weight:600">
              <option value="muestra" ${it.tipo==='muestra'?'selected':''}>Muestra</option>
              <option value="producto" ${it.tipo==='producto'?'selected':''}>Producto</option>
            </select>
          </div>
          <div style="flex:1;min-width:240px">
            <select data-pi="${i}" data-f="cat" style="width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px">
              ${getCatalogOptionsHtml(it.tipo, it.catalogo_id, it.nombre)}
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <span style="font-size:12px;color:var(--mut)">Cant:</span>
            <input type="number" min="1" max="9999" data-pi="${i}" data-f="cant" value="${it.cantidad_solicitada || 1}" style="width:70px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--tx);font-size:13px;text-align:center;font-weight:600">
          </div>
          <button type="button" class="btn dg sm" data-pidel="${i}" title="Eliminar ítem" style="padding:4px 8px">✕</button>
        </div>
      `).join('');

      list.querySelectorAll('[data-pi]').forEach(el => {
        el.onchange = () => {
          const i = +el.dataset.pi;
          const f = el.dataset.f;
          if (f === 'tipo') {
            pedItems[i].tipo = el.value;
            pedItems[i].catalogo_id = null;
            pedItems[i].nombre = '';
            renderPfItems();
          } else if (f === 'cat') {
            const selOpt = el.options[el.selectedIndex];
            pedItems[i].catalogo_id = el.value ? +el.value : null;
            pedItems[i].nombre = selOpt ? selOpt.dataset.nombre || '' : '';
          } else if (f === 'cant') {
            pedItems[i].cantidad_solicitada = Math.max(1, +el.value || 1);
          }
        };
      });

      list.querySelectorAll('[data-pidel]').forEach(b => {
        b.onclick = () => {
          pedItems.splice(+b.dataset.pidel, 1);
          renderPfItems();
        };
      });
    }

    renderPfItems();

    $('#pf_add_item').onclick = () => {
      pedItems.push({ tipo: 'muestra', catalogo_id: null, nombre: '', cantidad_solicitada: 1 });
      renderPfItems();
    };

    // Toggle formulario
    let pfVisible = true;
    $('#pf_toggle').onclick = () => {
      pfVisible = !pfVisible;
      $('#pf_form_wrap').style.display = pfVisible ? '' : 'none';
      $('#pf_toggle').textContent = pfVisible ? 'Ocultar formulario' : 'Mostrar formulario';
    };

    // Enviar pedido
    $('#pf_submit').onclick = async () => {
      let medico = selMedico.value;
      let targetVisitadorId = null;

      if (medico === '__manual__') {
        medico = manMedico.value.trim();
      } else if (medico) {
        const opt = selMedico.options[selMedico.selectedIndex];
        if (opt && opt.dataset.vid) {
          targetVisitadorId = +opt.dataset.vid;
        }
      }

      if (!medico) { toast('Debe seleccionar o ingresar el nombre del médico.', 1); return; }
      if (!pedItems.length) { toast('Agregue al menos un producto o muestra al pedido.', 1); return; }
      const unselected = pedItems.find(it => !it.nombre || !it.nombre.trim());
      if (unselected) {
        toast('Debe seleccionar el producto o muestra en cada una de las filas agregadas.', 1);
        return;
      }
      try {
        const ord = await api('/api/orders', {
          method: 'POST',
          body: {
            medico,
            visitador_id: targetVisitadorId,
            fecha_solicitud: $('#pf_fecha_sol').value || null,
            fecha_entrega: $('#pf_fecha_ent').value || null,
            notas: $('#pf_notas').value.trim() || null,
            items: pedItems.map(it => ({
              catalogo_id: it.catalogo_id || null,
              nombre: it.nombre.trim(),
              tipo: it.tipo,
              cantidad_solicitada: it.cantidad_solicitada || 1
            }))
          }
        });
        toast('✅ Pedido enviado a planta con éxito. #' + ord.id);
        selMedico.value = '';
        selMedico.dispatchEvent(new Event('change'));
        manMedico.value = '';
        $('#pf_fecha_sol').value = new Date().toISOString().split('T')[0];
        $('#pf_fecha_ent').value = '';
        $('#pf_notas').value = '';
        pedItems = [{ tipo: 'muestra', catalogo_id: null, nombre: '', cantidad_solicitada: 1 }];
        renderPfItems();
        loadPedidos();
      } catch(e) {
        toast(e.message, 1);
      }
    };

    // Cargar tabla de pedidos
    async function loadPedidos() {
      const st = $('#pt_status').value;
      const vid = me.admin ? ($('#pt_vis')?.value || '') : '';
      let qs = [];
      if (st) qs.push('status=' + st);
      if (vid) qs.push('visitador_id=' + vid);
      const url = '/api/orders' + (qs.length ? '?' + qs.join('&') : '');

      try {
        const rows = await api(url);
        const tbl = $('#ped_tbl');
        if (!rows.length) {
          tbl.innerHTML = '<p style="color:var(--mut);text-align:center;padding:24px">No hay pedidos registrados.</p>';
          return;
        }

        tbl.innerHTML = `<table>
          <thead>
            <tr>
              <th>Fecha Solicitud</th>
              ${me.admin ? '<th>Visitador</th>' : ''}
              <th>Médico / Destinatario</th>
              <th>Producto o Muestra</th>
              <th style="text-align:center">Total Cant.</th>
              <th>Fecha Entrega</th>
              <th>Estatus</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(o => {
              const isOwner = o.visitador_id === me.id;
              const canDirectEdit = me.admin || (isOwner && o.status === 'enviado');
              const canRequestEdit = !me.admin && isOwner && (o.status !== 'enviado');
              const canDel = me.admin || (isOwner && o.status === 'enviado');

              return `<tr>
                <td style="white-space:nowrap">${fmtDate(o.fecha_solicitud)}</td>
                ${me.admin ? `<td><strong>${esc(o.visitador_nombre || o.visitador_email)}</strong></td>` : ''}
                <td>
                  ${esc(o.medico)}
                  ${o.pending_edit ? '<span title="Edición pendiente de aprobación por el administrador" style="margin-left:4px;font-size:12px;color:#d97706">⚠</span>' : ''}
                </td>
                <td>${renderItemsListHtml(o.items)}</td>
                <td style="text-align:center"><span class="badge" style="font-size:12px">${calcTotalQty(o.items)}</span></td>
                <td style="white-space:nowrap">${fmtDate(o.fecha_entrega)}</td>
                <td>${orderStatusBadge(o.status)}</td>
                <td style="white-space:nowrap">
                  <button class="btn sm" data-oid="${o.id}" data-act="pver">Ver</button>
                  ${canDirectEdit ? `<button class="btn sm sec" data-oid="${o.id}" data-act="pedit" style="margin-left:4px">Editar</button>` : ''}
                  ${canRequestEdit ? `<button class="btn sm sec" data-oid="${o.id}" data-act="pedit_req" style="margin-left:4px" title="Modificar solicitud (requiere aprobación)">✏️ Solicitar Cambio</button>` : ''}
                  ${canDel ? `<button class="btn sm dg" data-oid="${o.id}" data-act="pdel" style="margin-left:4px">Eliminar</button>` : ''}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;

        tbl.querySelectorAll('[data-act="pver"]').forEach(b => {
          b.onclick = () => openOrderDetail(+b.dataset.oid, 'pedidos');
        });
        tbl.querySelectorAll('[data-act="pedit"]').forEach(b => {
          b.onclick = () => openOrderEdit(+b.dataset.oid, false);
        });
        tbl.querySelectorAll('[data-act="pedit_req"]').forEach(b => {
          b.onclick = () => openOrderEdit(+b.dataset.oid, true);
        });
        tbl.querySelectorAll('[data-act="pdel"]').forEach(b => {
          b.onclick = async () => {
            if (!confirm('¿Está seguro de eliminar este pedido?')) return;
            try {
              await api('/api/orders/' + b.dataset.oid, { method: 'DELETE' });
              toast('Pedido eliminado.');
              loadPedidos();
            } catch(e) { toast(e.message, 1); }
          };
        });

      } catch(e) {
        $('#ped_tbl').innerHTML = `<p style="color:var(--err)">Error al cargar pedidos: ${esc(e.message)}</p>`;
      }
    }

    $('#pt_filtrar').onclick = loadPedidos;
    $('#pt_limpiar').onclick = () => {
      $('#pt_status').value = '';
      if ($('#pt_vis')) $('#pt_vis').value = '';
      loadPedidos();
    };
    loadPedidos();

    // Modal para ver detalle de pedido
    async function openOrderDetail(oid, fromTab) {
      const modal = $('#p_modal');
      const inner = $('#p_modal_inner');
      inner.innerHTML = '<div style="padding:30px;text-align:center;color:var(--mut)">Cargando detalle del pedido…</div>';
      modal.style.display = 'flex';
      modal.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };

      try {
        const o = await api('/api/orders/' + oid);
        const visName = o.visitador_nombre || o.visitador_email;

        inner.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;border-bottom:1px solid var(--bd);padding-bottom:12px">
            <div>
              <h2 style="margin:0;font-size:18px;display:flex;align-items:center;gap:8px">
                <span>📦 Pedido #${o.id}</span>
                ${orderStatusBadge(o.status)}
              </h2>
              <div style="font-size:13px;color:var(--mut);margin-top:4px">
                Visitador: <strong>${esc(visName)}</strong>
              </div>
            </div>

    // Modal para editar pedido
    async function openOrderEdit(oid, isPendingNotice) {
      const modal = $('#p_modal');
      const inner = $('#p_modal_inner');
      inner.innerHTML = '<div style="padding:30px;text-align:center;color:var(--mut)">Cargando pedido para edición…</div>';
      modal.style.display = 'flex';
      modal.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };

      try {
        const o = await api('/api/orders/' + oid);
        let medListEdit = [];
        try { medListEdit = await api('/api/orders/medicos'); } catch(e) {}
        let editItems = (o.items || []).map(it => ({
          id: it.id,
          tipo: it.tipo || 'muestra',
          catalogo_id: it.catalogo_id || null,
          nombre: it.nombre || '',
          cantidad_solicitada: it.cantidad_solicitada || 1
        }));

        const renderEditItems = () => {
          const eli = $('#ped_edit_items');
          if (!eli) return;
          if (!editItems.length) {
            eli.innerHTML = '<p style="color:var(--mut);font-size:13px">Sin ítems. Agregue al menos uno.</p>';
            return;
          }
          eli.innerHTML = editItems.map((it, i) => `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;background:var(--bg2);padding:8px;border-radius:6px;border:1px solid var(--bd)">
              <div style="width:110px">
                <select data-ei="${i}" data-f="tipo" style="width:100%;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:13px;font-weight:600">
                  <option value="muestra" ${it.tipo==='muestra'?'selected':''}>Muestra</option>
                  <option value="producto" ${it.tipo==='producto'?'selected':''}>Producto</option>
                </select>
              </div>
              <div style="flex:1;min-width:200px">
                <select data-ei="${i}" data-f="cat" style="width:100%;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:13px">
                  ${getCatalogOptionsHtml(it.tipo, it.catalogo_id, it.nombre)}
                </select>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <span style="font-size:12px;color:var(--mut)">Cant:</span>
                <input type="number" min="1" max="9999" data-ei="${i}" data-f="cant" value="${it.cantidad_solicitada || 1}" style="width:65px;padding:5px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:13px;text-align:center;font-weight:600">
              </div>
              <button type="button" class="btn dg sm" data-eidel="${i}">✕</button>
            </div>
          `).join('');

          eli.querySelectorAll('[data-ei]').forEach(el => {
            el.onchange = () => {
              const i = +el.dataset.ei;
              const f = el.dataset.f;
              if (f === 'tipo') {
                editItems[i].tipo = el.value;
                editItems[i].catalogo_id = null;
                editItems[i].nombre = '';
                renderEditItems();
              } else if (f === 'cat') {
                const selOpt = el.options[el.selectedIndex];
                editItems[i].catalogo_id = el.value ? +el.value : null;
                editItems[i].nombre = selOpt ? selOpt.dataset.nombre || '' : '';
              } else if (f === 'cant') {
                editItems[i].cantidad_solicitada = Math.max(1, +el.value || 1);
              }
            };
          });

          eli.querySelectorAll('[data-eidel]').forEach(b => {
            b.onclick = () => {
              editItems.splice(+b.dataset.eidel, 1);
              renderEditItems();
            };
          });
        };

        inner.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;border-bottom:1px solid var(--bd);padding-bottom:10px">
            <h2 style="margin:0;font-size:18px">✏️ Editar Pedido #${o.id}</h2>
            <button class="btn sec sm" id="pe_close">✕ Cerrar</button>
          </div>

          ${isPendingNotice ? `
            <div style="padding:10px 14px;background:rgba(245,158,11,.12);border-radius:8px;border-left:3px solid #f59e0b;font-size:13px;margin-bottom:14px;color:#d97706">
              ⚠ <strong>Nota:</strong> Este pedido ya fue tomado por el administrador. Las modificaciones que guardes quedarán marcadas como <em>pendientes de aprobación</em> por parte de la administración.
            </div>
          ` : ''}

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px">
            <label class="fld">
              <span>Médico / Destinatario *</span>
              <input id="pe_medico" list="dl_pe_medicos" value="${esc(o.medico)}" required>
              <datalist id="dl_pe_medicos">
                ${medListEdit.map(m => `<option value="${esc(m.medico)}">${esc(m.medico)}${m.institucion ? ' (' + esc(m.institucion) + ')' : ''}${me.admin ? ' — 👤 ' + esc(m.visitador_nombre || m.visitador_email) : ''}</option>`).join('')}
              </datalist>
            </label>
            <label class="fld">
              <span>Fecha Solicitud</span>
              <input type="date" id="pe_fecha_sol" value="${o.fecha_solicitud ? o.fecha_solicitud.split('T')[0] : ''}">
            </label>
            <label class="fld">
              <span>Fecha Entrega</span>
              <input type="date" id="pe_fecha_ent" value="${o.fecha_entrega ? o.fecha_entrega.split('T')[0] : ''}">
            </label>
          </div>

          <label class="fld" style="margin-bottom:12px">
            <span>Notas del Pedido</span>
            <textarea id="pe_notas" rows="2">${esc(o.notas || '')}</textarea>
          </label>

          ${me.admin ? `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px;background:var(--bg2);padding:12px;border-radius:8px;border:1px solid var(--bd)">
              <label class="fld" style="margin:0">
                <span>Estatus del Pedido (Admin)</span>
                <select id="pe_status" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)">
                  <option value="enviado" ${o.status==='enviado'?'selected':''}>Enviado a Planta</option>
                  <option value="revision" ${o.status==='revision'?'selected':''}>En Revisión</option>
                  <option value="aprobado" ${o.status==='aprobado'?'selected':''}>Aprobado</option>
                  <option value="listo" ${o.status==='listo'?'selected':''}>Pedido Listo</option>
                  <option value="rechazado" ${o.status==='rechazado'?'selected':''}>Rechazado</option>
                </select>
              </label>
              <label class="fld" style="margin:0">
                <span>Observaciones del Administrador</span>
                <textarea id="pe_admin_notas" rows="2" placeholder="Observaciones…">${esc(o.admin_notas || '')}</textarea>
              </label>
            </div>
          ` : ''}

          <div style="margin-bottom:14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <strong style="font-size:13px">Productos y Muestras Registradas:</strong>
              <button type="button" class="btn sec sm" id="pe_add">+ Agregar ítem</button>
            </div>
            <div id="ped_edit_items"></div>
          </div>

          <div style="display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--bd);padding-top:12px">
            <button class="btn sec" id="pe_cancel">Cancelar</button>
            <button class="btn" id="pe_save">💾 Guardar Cambios</button>
          </div>
        `;

        renderEditItems();

        $('#pe_close').onclick = $('#pe_cancel').onclick = () => modal.style.display = 'none';
        $('#pe_add').onclick = () => {
          editItems.push({ tipo: 'muestra', catalogo_id: null, nombre: '', cantidad_solicitada: 1 });
          renderEditItems();
        };

        $('#pe_save').onclick = async () => {
          const medico = $('#pe_medico').value.trim();
          if (!medico) { toast('El médico es requerido.', 1); return; }
          if (!editItems.length) { toast('Debe tener al menos un ítem.', 1); return; }
          const unselected = editItems.find(it => !it.nombre || !it.nombre.trim());
          if (unselected) {
            toast('Todos los ítems deben tener un producto o muestra seleccionada.', 1);
            return;
          }

          const body = {
            medico,
            fecha_solicitud: $('#pe_fecha_sol').value || null,
            fecha_entrega: $('#pe_fecha_ent').value || null,
            notas: $('#pe_notas').value.trim() || null,
            items: editItems.map(it => ({
              catalogo_id: it.catalogo_id || null,
              nombre: it.nombre.trim(),
              tipo: it.tipo,
              cantidad_solicitada: it.cantidad_solicitada || 1
            }))
          };

          if (me.admin) {
            body.status = $('#pe_status').value;
            body.admin_notas = $('#pe_admin_notas').value.trim() || null;
          }

          try {
            const r = await api('/api/orders/' + oid, { method: 'PATCH', body });
            if (r.pending) {
              toast(r.msg);
            } else {
              toast('✅ Pedido actualizado correctamente.');
            }
            modal.style.display = 'none';
            loadPedidos();
          } catch(e) {
            toast(e.message, 1);
          }
        };

      } catch(e) {
        inner.innerHTML = `<div style="padding:20px;color:var(--err)">Error: ${esc(e.message)}</div>`;
      }
    }
  }
}

  let i;
  const stList = Object.keys(geo).length ? Object.keys(geo) : ESTADOS;

  else if (t === 'estado') i = `<select id="${id}"><option value="">Seleccione…</option>${opts(stList)}</select>`;
  else if (t === 'ciudad') i = `<input id="${id}" list="dl_ciudades" autocomplete="off" placeholder="Seleccione o escriba…"><datalist id="dl_ciudades"></datalist>`;
  else if (t === 'yn') {
    i = `<select id="${id}"><option value=""></option>${opts(['Sí', 'No'])}</select>`;
    if (n === 'muestras_entregadas') {
      i += `<div id="muestras_box" style="display:none;margin-top:8px">
        <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(15,157,138,.12);border:1px solid var(--ac);border-radius:8px;font-size:13px;color:var(--tx)">
          <span id="muestras_resumen"></span>
          <button type="button" class="btn sec sm" id="btn_editar_muestras" style="padding:2px 8px;font-size:12px">Modificar</button>
        </div>
      </div>`;
    }
    if (n === 'productos_entregados') {
      i += `<div id="productos_box" style="display:none;margin-top:8px">
        <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(59,130,246,.12);border:1px solid #3b82f6;border-radius:8px;font-size:13px;color:var(--tx)">
          <span id="productos_resumen"></span>
          <button type="button" class="btn sec sm" id="btn_editar_productos" style="padding:2px 8px;font-size:12px">Modificar</button>
        </div>
      </div>`;
    }
  }
  else if (t === 'esp') i = `<input id="${id}" list="dl_esp" autocomplete="off"><datalist id="dl_esp">${opts(cat.especialidad.map(o => o.nombre))}</datalist>`;
  else i = `<input id="${id}" type="${t || 'text'}"${r}>`;

  return `<label class="fld ${t === 'area' ? 'full' : ''}" id="lbl_${n}"><span>${l}${req ? ' *' : ''}</span>${i}</label>`;
}

async function vAsignaciones(tab) {
  if (!me.admin) tab = 'stock';
  else if (!tab) tab = 'reporte';
  const main = $('#main');

  const tabs = me.admin
    ? [['stock','📦 Stock'],['reporte','📊 Reporte de Inventario']]
    : [['stock','📦 Stock']];

  const tabsHtml = tabs.map(([t,l]) =>
    `<button class="tab-btn${tab===t?' active':''}" data-t="${t}">${l}</button>`
  ).join('');

  main.innerHTML = `<h1>Asignaciones</h1><p style="color:var(--mut);margin-top:-8px">Inventario de muestras y productos</p>
    <div class="tabs" style="margin-bottom:16px">${tabsHtml}</div>
    <div id="asig_body"></div>`;

  document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => vAsignaciones(b.dataset.t));
  const body = $('#asig_body');

  // ===== TAB: Mi Stock =====
  if (tab === 'stock') {
    body.innerHTML = '<p style="color:var(--mut)">Cargando...</p>';
    let visitadorSel = '';
    if (me.admin) {
      const todosUsuarios = await api('/api/users');
      const visitadores = todosUsuarios.filter(u => u.rol === 'visitador' && u.activo);
      const opts = visitadores.map(v => `<option value="${v.id}">${esc(v.nombre || v.email)}</option>`).join('');
      visitadorSel = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <label style="font-weight:600">Visitador:</label>
        <select id="asig_vis_sel" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)">
          <option value="">— Mi cuenta —</option>${opts}
        </select>
      </div>`;
    }
    const renderStock = async (visitadorId) => {
      const url = visitadorId ? `/api/inventory?visitador_id=${visitadorId}` : '/api/inventory';
      const rows = await api(url);
      const tblDiv = $('#asig_stock_tbl');
      if (!rows.length) {
        tblDiv.innerHTML = '<p style="color:var(--mut);padding:16px">Sin movimientos de inventario registrados aún.</p>';
        return;
      }
      const muestras = rows.filter(r => r.tipo === 'muestra');
      const productos = rows.filter(r => r.tipo === 'producto');
      const tbl = (titulo, data) => !data.length ? '' : `
        <div class="card" style="margin-bottom:16px">
          <h3 style="margin:0 0 10px">${titulo}</h3>
          <div style="overflow-x:auto">
          <table class="adv-table">
            <thead><tr><th>Nombre</th><th>Asignado</th><th>Entregado</th><th>Stock Actual</th></tr></thead>
            <tbody>${data.map(r => `<tr>
              <td>${esc(r.nombre)}</td>
              <td>${r.total_asignado}</td>
              <td>${r.total_entregado}</td>
              <td><b style="color:${+r.stock>0?'var(--ac)':+r.stock<0?'var(--err)':'var(--mut)'}">${r.stock}</b></td>
            </tr>`).join('')}</tbody>
          </table>
          </div>
        </div>`;
      tblDiv.innerHTML = tbl('🧪 Muestras', muestras) + tbl('📦 Productos', productos);
    };
    body.innerHTML = visitadorSel + '<div id="asig_stock_tbl"><p style="color:var(--mut)">Cargando...</p></div>';
    await renderStock('');
    if (me.admin) {
      $('#asig_vis_sel').onchange = async e => { await renderStock(e.target.value); };
    }

  // ===== TAB: Reporte =====
  } else if (tab === 'reporte') {
    const visitadores = await api('/api/inventory/visitadores');
    const visOpts = '<option value="">Todos los visitadores</option>' +
      visitadores.map(v => `<option value="${v.id}">${esc(v.nombre)}</option>`).join('');

    body.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:4px">
            <label style="font-size:12px;color:var(--mut)">Desde</label>
            <input type="date" id="rpt_from" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)">
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <label style="font-size:12px;color:var(--mut)">Hasta</label>
            <input type="date" id="rpt_to" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)">
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <label style="font-size:12px;color:var(--mut)">Visitador</label>
            <select id="rpt_vis" style="padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)">${visOpts}</select>
          </div>
          <button id="rpt_btn" class="btn">🔍 Filtrar</button>
        </div>
      </div>
      <div id="rpt_result"></div>`;

    const loadReport = async () => {
      const from = $('#rpt_from').value;
      const to = $('#rpt_to').value;
      const vid = $('#rpt_vis').value;
      let url = '/api/inventory/report?x=1';
      if (from) url += '&from=' + from;
      if (to)   url += '&to=' + to;
      if (vid)  url += '&visitador_id=' + vid;
      const result = $('#rpt_result');
      result.innerHTML = '<p style="color:var(--mut)">Cargando...</p>';
      const rows = await api(url);
      if (!rows.length) {
        result.innerHTML = '<p style="color:var(--mut);padding:16px">Sin datos para los filtros seleccionados.</p>';
        return;
      }
      const byVis = {};
      for (const r of rows) {
        const key = r.visitador_id;
        if (!byVis[key]) byVis[key] = { nombre: r.visitador_nombre, email: r.visitador_email, items: [] };
        byVis[key].items.push(r);
      }
      let html = '';
      for (const [vid2, vis] of Object.entries(byVis)) {
        const totalAsig = vis.items.reduce((s,r) => s + (+r.total_asignado), 0);
        const totalEnt  = vis.items.reduce((s,r) => s + (+r.total_entregado), 0);
