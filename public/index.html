<script>
const $ = s => document.querySelector(s), root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.style.background = err ? 'var(--dg)' : ''; t.style.color = err ? '#fff' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); };
let isAuthRedirecting = false;
const api = async (u, o = {}) => {
  try {
    const r = await fetch(u, { method: o.method || 'GET', headers: { 'Content-Type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) {
      const err = new Error(d.error || 'No autenticado');
      err.status = 401;
      // NUNCA hacer location.reload() en 401 para evitar bucle infinito de recargas continuas
      if (me && !isAuthRedirecting) {
        isAuthRedirecting = true;
        me = null;
        try { await dbSaveCache('me', null); } catch {}
        loginScreen();
        setTimeout(() => { isAuthRedirecting = false; }, 1000);
      }
      throw err;
    }
    if (!r.ok) {
      const err = new Error(d.error || 'Error en petición');
      err.status = r.status;
      throw err;
    }
    return d;
  } catch (err) {
    if (!navigator.onLine || err.message.includes('fetch') || err.message.includes('Network') || err.message.includes('Load failed')) {
      const netErr = new Error('NETWORK_OFFLINE');
      netErr.isOffline = true;
      throw netErr;
    }
    throw err;
  }
};

// ---------- Almacenamiento Local Offline (IndexedDB) ----------
const DB_NAME = 'visitas_erp_offline';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('outbox')) {
        db.createObjectStore('outbox', { keyPath: 'client_uuid' });
      }
      if (!db.objectStoreNames.contains('cache')) {
        db.createObjectStore('cache', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbSaveOutbox(item) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outbox', 'readwrite');
    tx.objectStore('outbox').put(item);
    tx.oncomplete = () => resolve(true);
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGetOutbox() {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('outbox', 'readonly');
      const req = tx.objectStore('outbox').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = e => reject(e.target.error);
    });
  } catch (e) { return []; }
}

async function dbRemoveOutbox(client_uuid) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('outbox', 'readwrite');
      tx.objectStore('outbox').delete(client_uuid);
      tx.oncomplete = () => resolve(true);
      tx.onerror = e => reject(e.target.error);
    });
  } catch (e) { return false; }
}

async function dbSaveCache(key, val) {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const tx = db.transaction('cache', 'readwrite');
      tx.objectStore('cache').put({ key, val, updated_at: Date.now() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function dbGetCache(key) {
  try {
    const db = await openDB();
    return new Promise(resolve => {
      const tx = db.transaction('cache', 'readonly');
      const req = tx.objectStore('cache').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.val : null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

let isSyncing = false;

async function updateNetStatus(count, isSyncingNow) {
  const wrap = $('#net_pill_wrap');
  if (!wrap) return;
  if (count === undefined) {
    try {
      const pending = await dbGetOutbox();
      count = pending.length;
    } catch (e) { count = 0; }
  }
  const isOnline = navigator.onLine;

  let bg, col, dotCol, text, title;
  if (isSyncingNow) {
    bg = 'rgba(59,130,246,.18)'; col = '#60a5fa'; dotCol = '#3b82f6';
    text = `🔄 Sincronizando (${count})…`;
    title = 'Enviando visitas al servidor...';
  } else if (count > 0) {
    bg = 'rgba(245,158,11,.18)'; col = '#fbbf24'; dotCol = '#f59e0b';
    text = `📱 ${count} pendiente${count > 1 ? 's' : ''}`;
    title = `${count} visita(s) guardada(s) localmente. Clic para sincronizar.`;
  } else if (!isOnline) {
    bg = 'rgba(239,68,68,.18)'; col = '#f87171'; dotCol = '#ef4444';
    text = '🟠 Sin conexión';
    title = 'Modo offline activo. Puedes seguir trabajando con normalidad.';
  } else {
    bg = 'rgba(16,185,129,.18)'; col = '#34d399'; dotCol = '#10b981';
    text = '🟢 En línea';
    title = 'Conectado al servidor central';
  }

  wrap.innerHTML = `
    <div id="btn_net_status" title="${title}" style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:${bg};color:${col};cursor:pointer;border:1px solid rgba(255,255,255,.1);transition:all .2s">
      <span style="width:7px;height:7px;border-radius:50%;background:${dotCol};display:inline-block"></span>
      <span>${text}</span>
    </div>
  `;
  const btn = $('#btn_net_status');
  if (btn) btn.onclick = () => {
    if (count > 0 && navigator.onLine) {
      toast('Sincronizando visitas pendientes...');
      checkPendingAndSync();
    } else if (count > 0 && !navigator.onLine) {
      toast(`Tienes ${count} visita(s) guardada(s) en este dispositivo esperando cobertura.`, 1);
    } else if (!navigator.onLine) {
      toast('Sin conexión de red. Todas las visitas que registres se guardarán seguras en este dispositivo.', 0);
    } else {
      toast('Conectado en línea. El sistema está al día.', 0);
    }
  };
}

async function checkPendingAndSync() {
  const pending = await dbGetOutbox();
  updateNetStatus(pending.length);

  if (!pending.length) return;
  if (!navigator.onLine || isSyncing) return;

  try {
    const ping = await fetch('/api/ping', { cache: 'no-store' }).then(r => r.json());
    if (!ping || !ping.ok) return;
  } catch (e) {
    return;
  }

  isSyncing = true;
  updateNetStatus(pending.length, true);

  let synced = 0;
  for (const item of pending) {
    try {
      const res = await api('/api/visits', {
        method: 'POST',
        body: {
          ...item.body,
          client_uuid: item.client_uuid,
          fecha_offline: item.fecha_offline,
          is_offline: true
        }
      });
      if (res && res.ok) {
        await dbRemoveOutbox(item.client_uuid);
        synced++;
      }
    } catch (err) {
      console.warn('Error sincronizando visita offline:', err);
      if (err.isOffline) break;
    }
  }

  isSyncing = false;
  const remaining = await dbGetOutbox();
  updateNetStatus(remaining.length);

  if (synced > 0) {
    toast(`¡${synced} visita${synced > 1 ? 's' : ''} sincronizada${synced > 1 ? 's' : ''} con éxito al servidor!`);
    if (view === 'visitas') vVisitas();
    if (view === 'dash') vDash();
  }
}
const fmtDT = s => new Date(s).toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' });
const ESTADOS = ['Amazonas','Anzoátegui','Apure','Aragua','Barinas','Bolívar','Carabobo','Cojedes','Delta Amacuro','Distrito Capital','Falcón','Guárico','La Guaira','Lara','Mérida','Miranda','Monagas','Nueva Esparta','Portuguesa','Sucre','Táchira','Trujillo','Yaracuy','Zulia'];

// ---------- Tema ----------
const applyTheme = () => {
  const t = localStorage.getItem('theme') || 'system';
  document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

// ---------- Campos del formulario (mismos que la hoja de registros) ----------
const SECTIONS = [
  ['Datos de la visita', [['lugar_visita','Lugar de visita','inst',1],['estado','Estado','estado'],['ciudad','Ciudad','ciudad'],['zona','Zona'],['razon_social','Razón social','text',1],['direccion','Dirección','area']]],
  ['Médicos', [['cedula','DNI / Cédula','hidden'],['cliente','Cliente'],['fecha_nacimiento','Fecha de nacimiento','date'],['nro_colegiado','Nro. de colegiado'],['especialidad','Especialidad del médico','esp'],['operaciones_mensuales','Operaciones mensuales'],['pacientes_diarios','Pacientes diarios'],['costo_consultas','Costo de consultas'],['horario_trabajo','Horario de trabajo'],['otra_institucion','Otra institución donde labora'],['horario_otra_institucion','Horario otra institución']]],
  ['Contacto', [['encargado','Encargado'],['responsable','Responsable'],['contacto','Contacto (teléfono)','tel'],['mas_info_contacto','Más información de contacto'],['correo','Correo electrónico','email']]],
  ['Redes sociales', [['instagram','Instagram'],['facebook','Facebook'],['otras_redes','Otras redes sociales']]],
  ['Secretaria', [['secretaria_nombre','Nombre de secretaria'],['secretaria_fecha_nacimiento','Fecha de nacimiento','date'],['secretaria_telefono','Nro. de teléfono','tel'],['secretaria_facebook','Facebook'],['secretaria_instagram','Instagram'],['secretaria_otras_redes','Otras redes sociales']]],
  ['Evaluación comercial', [['muestras_entregadas','Muestras médicas entregadas','yn'],['muestras_detalle','Detalle de muestras entregadas','hidden'],['usaria_producto','Usaría el producto','yn'],['prescribe_suplementos','Prescribe suplementos','yn'],['prescribira_suplementos','Prescribirá suplementos','yn'],['comprometido','Comprometido','yn'],['observaciones','Observaciones o sugerencias','area']]]
];
const ALLF = SECTIONS.flatMap(s => s[1]);
const LABEL = Object.fromEntries([...ALLF.map(f => [f[0], f[1]]), ['tipo_visita','Tipo de visita'], ['ubicacion','Ubicación'], ['muestras_detalle','Muestras entregadas (detalle)'], ['cedula','DNI / Cédula']]);
const PREFILL = ['cedula','lugar_visita','estado','ciudad','zona','razon_social','direccion','cliente','fecha_nacimiento','nro_colegiado','especialidad','operaciones_mensuales','pacientes_diarios','costo_consultas','horario_trabajo','otra_institucion','horario_otra_institucion','encargado','responsable','contacto','mas_info_contacto','correo','instagram','facebook','otras_redes','secretaria_nombre','secretaria_fecha_nacimiento','secretaria_telefono','secretaria_facebook','secretaria_instagram','secretaria_otras_redes','muestras_entregadas','muestras_detalle'];

let me = null, cat = { institucion: [], especialidad: [], muestra: [], producto: [] }, geo = {}, rows = [], page = 0, view = 'dash';
const PS = 25;

// ---------- Arranque / login ----------
async function boot() {
  try {
    me = await api('/api/me');
    await dbSaveCache('me', me);
  } catch (e) {
    if (e && e.isOffline) {
      me = await dbGetCache('me');
    } else {
      me = null;
      try { await dbSaveCache('me', null); } catch {}
    }
  }
  if (!me) return loginScreen();

  try {
    cat = await api('/api/catalogs');
    cat.muestra = cat.muestra || [];
    cat.producto = cat.producto || [];
    await dbSaveCache('catalogs', cat);
  } catch (e) {
    cat = (await dbGetCache('catalogs')) || { institucion: [], especialidad: [], muestra: [], producto: [] };
    cat.muestra = cat.muestra || [];
    cat.producto = cat.producto || [];
  }

  try {
    geo = await api('/api/geography');
    await dbSaveCache('geography', geo);
  } catch (e) {
    geo = (await dbGetCache('geography')) || {};
  }

  shell();
  go(location.hash.slice(1) || 'dash');
  updateNetStatus();
  checkPendingAndSync();
}

function go(v) {

  api('/api/logs/track', { method: 'POST', body: { modulo: modNames[v] || v, detalle: `Ingresó al módulo ${modNames[v] || v}` } }).catch(() => {});

}

let calCurrentView = 'month'; // 'month' o 'agenda'

async function vAgendar() {
  const main = $('#main');
  const isA = me.admin;
  let curYear = new Date().getFullYear(), curMonth = new Date().getMonth();
  let allUsers = [], filterUserId = '';

  if (isA) {
    try { allUsers = await api('/api/events/users'); } catch {}
  }

  function fmtDT(dt) {
    if (!dt) return '—';
    return new Date(dt).toLocaleString('es-VE', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function fmtTime(dt) {
    if (!dt) return '';
    return new Date(dt).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' });
  }
  function toLocalInput(dt) {
    if (!dt) return '';
    const d = new Date(dt), pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function fetchSummary() {
    try {
      return await api('/api/events/summary');
    } catch {
      return { total: 0, hoy: 0, manana: 0, semana: 0 };
    }
  }

  async function fetchEvents() {
    const from = new Date(curYear, curMonth - 1, 20).toISOString();
    const to   = new Date(curYear, curMonth + 2, 10, 23, 59, 59).toISOString();
    const params = new URLSearchParams({ from, to });
    if (isA && filterUserId) params.set('user_id', filterUserId);
    const d = await api(`/api/events?${params}`);
    return d.rows || [];
  }

  function getCatMeta(cat) {
    const map = {
      visita:   { label: 'Visita Médica', color: '#0f9d8a', icon: '🩺' },
      muestras: { label: 'Entrega de Muestras', color: '#10b981', icon: '📦' },
      cobranza: { label: 'Cobranza', color: '#f59e0b', icon: '💵' },
      reunion:  { label: 'Reunión Clínica', color: '#8b5cf6', icon: '👥' },
      otro:     { label: 'Actividad / Otro', color: '#64748b', icon: '📌' }
    };
    return map[cat] || map.visita;

  function openEventModal(ev = null, defaultDate = null) {

      defEnd   = `${defaultDate.getFullYear()}-${pad(defaultDate.getMonth()+1)}-${pad(defaultDate.getDate())}T10:00`;
    } else {
      const now = new Date();
      defStart = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours()+1)}:00`;

        <div class="fld" style="margin-bottom:0">
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">

        <div class="fld" style="background:rgba(15,157,138,.06);padding:10px;border-radius:8px;border:1px solid rgba(15,157,138,.2)">

          </label>
          <select id="ev_rem" style="margin-top:6px" ${!canEdit?'disabled':''}>

            <option value="2880" ${curRem===2880?'selected':''}>📅 2 días antes</option>
            <option value="120" ${curRem===120?'selected':''}>⏰ 2 horas antes</option>
            <option value="60" ${curRem===60?'selected':''}>⏰ 1 hora antes</option>
            <option value="30" ${curRem===30?'selected':''}>⏰ 30 minutos antes</option>
            <option value="15" ${curRem===15?'selected':''}>⏰ 15 minutos antes</option>
            <option value="0" ${curRem===0?'selected':''}>🔔 En el momento exacto</option>
            <option value="-1" ${curRem===-1?'selected':''}>🔕 Sin recordatorio</option>
          </select>
          <div style="font-size:11px;color:var(--mut);margin-top:4px">
            El sistema emitirá alerta en pantalla y notificación push en su dispositivo cuando llegue el tiempo configurado.
          </div>
        </div>
        <div class="fld"><label>Descripción / Observaciones</label><textarea id="ev_desc" rows="2" placeholder="Detalles de la visita, temas a tratar, muestras a llevar..." ${!canEdit?'readonly':''}>${esc(ev?.descripcion||'')}</textarea></div>
        ${isA && ev ? `<div class="fld"><label>Registrado por</label><input readonly value="${esc(ev.user_nombre||ev.user_email)}"></div>` : ''}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:flex-end">

      </div>

      $('#ev_allday').onchange = () => {
        const ad = $('#ev_allday').checked;
        ['#ev_inicio','#ev_fin'].forEach(id => { const el = $(id); el.type = ad ? 'date' : 'datetime-local'; });
      };
      if ($('#ev_save')) $('#ev_save').onclick = async () => {
        const titulo = $('#ev_titulo').value.trim();
        const inicio = $('#ev_inicio').value;
        const fin    = $('#ev_fin').value;
        if (!titulo || !inicio || !fin) return toast('Título, inicio y fin son obligatorios', 1);

        const cat = $('#ev_cat').value;
        const color = getCatMeta(cat).color;
        const body = {
          titulo,
          descripcion: $('#ev_desc').value.trim(),

          medico_ref: $('#ev_ref').value.trim(),
          categoria: cat,
          color: color,
          recordatorio_min: parseInt($('#ev_rem').value),
          inicio: new Date(inicio).toISOString(),
          fin: new Date(fin).toISOString(),
          todo_el_dia: $('#ev_allday').checked
        };

        try {
          if (isNew) {
            await api('/api/events', { method: 'POST', body });
            toast('✅ Actividad agendada con éxito');

            await api(`/api/events/${ev.id}`, { method: 'PUT', body });
            toast('✅ Actividad actualizada');

          render();
          checkActivityAlerts();

  async function render() {
    const [events, sum] = await Promise.all([fetchEvents(), fetchSummary()]);
    const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const DAYS   = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
    const prevDays = new Date(curYear, curMonth, 0).getDate();
    const today = new Date();
    const todayStr = today.toDateString();

    const evByDay = {};
    events.forEach(ev => {
      const d = new Date(ev.inicio);
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if (!evByDay[key]) evByDay[key] = [];
      evByDay[key].push(ev);
    });

    // Celdas del calendario
    let cells = '';
    for (let i = 0; i < firstDay; i++) {
      const day = prevDays - firstDay + i + 1;
      cells += `<div class="cal-cell other-month"><div class="cal-num">${day}</div></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = new Date(curYear, curMonth, d).toDateString() === todayStr;
      const key = `${curYear}-${curMonth}-${d}`;
      const dayEvs = evByDay[key] || [];
      const evHtml = dayEvs.slice(0,3).map(ev => {
        const isMine = ev.user_id === (me.id || 0);
        const col = ev.color || '#0f9d8a';
        return `<div class="cal-ev${!isMine?' other-user':''}" style="background:${col}" data-evid="${ev.id}" title="${esc(ev.titulo)}${ev.user_nombre?' ('+esc(ev.user_nombre)+')':''}">${esc(ev.titulo)}</div>`;
      }).join('') + (dayEvs.length > 3 ? `<div style="font-size:10px;font-weight:700;color:var(--ac)">+${dayEvs.length-3} más</div>` : '');
      cells += `<div class="cal-cell${isToday?' today':''}" data-day="${d}">
        <div class="cal-num">${d}</div>${evHtml}</div>`;
    }
    const total = firstDay + daysInMonth;
    const rem = (7 - (total % 7)) % 7;
    for (let i = 1; i <= rem; i++) cells += `<div class="cal-cell other-month"><div class="cal-num">${i}</div></div>`;

    // Vista Agenda (Lista)
    let agendaHtml = '';
    if (events.length === 0) {
      agendaHtml = '<div class="card" style="text-align:center;padding:30px;color:var(--mut)">No hay actividades agendadas en este período. Presione "+ Agendar Actividad" para programar una.</div>';
    } else {
      agendaHtml = events.map(ev => {
        const col = ev.color || '#0f9d8a';
        const cat = getCatMeta(ev.categoria);
        const isMine = ev.user_id === (me.id || 0);
        return `
          <div class="cal-agenda-row" data-evid="${ev.id}" style="border-left:5px solid ${col};cursor:pointer">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span class="cal-pill" style="background:${col}">${cat.icon} ${cat.label}</span>
                <span style="font-size:12px;font-weight:700;color:var(--tx)">${fmtDT(ev.inicio)}</span>
                ${ev.recordatorio_min >= 0 ? `<span style="font-size:11px;color:var(--mut);display:inline-flex;align-items:center;gap:3px">🔔 Alerta activa</span>` : ''}
              </div>
              <div style="font-size:15px;font-weight:700;color:var(--tx)">${esc(ev.titulo)}</div>
              <div style="font-size:13px;color:var(--mut);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap">
                ${ev.medico_ref ? `<span>👨‍⚕️ ${esc(ev.medico_ref)}</span>` : ''}
                ${ev.ubicacion ? `<span>📍 ${esc(ev.ubicacion)}</span>` : ''}
                ${isA && !isMine ? `<span style="color:var(--ac)">👤 ${esc(ev.user_nombre||ev.user_email)}</span>` : ''}
              </div>
            </div>
            <button class="btn sec sm" style="padding:5px 12px">Ver detalle</button>
          </div>
        `;
      }).join('');
    }

    // Estado Push
    const pStatus = await getPushStatus();
    let pushBtnLabel = '🔔 Activar Alertas en este equipo';
    let pushBtnClass = 'push-status-btn';
    if (pStatus === 'subscribed') {
      pushBtnLabel = '✅ Alertas Push Activadas';
      pushBtnClass = 'push-status-btn active';
    } else if (pStatus === 'denied') {
      pushBtnLabel = '🔕 Notificaciones bloqueadas';
    }

    main.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div>
          <h1 style="margin:0;display:inline-flex;align-items:center;gap:8px">📅 Agendar</h1>
          <p style="margin:2px 0 0;font-size:13px;color:var(--mut)">Sistema de agenda propia con recordatorios y alertas automáticas</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${isA ? `<select id="cal_user_filter" style="width:auto;padding:7px 10px;font-size:13px">

      </div>

      <!-- Barra de métricas de agenda -->
      <div class="cal-kpis">

        </div>

          <span class="val">${sum.hoy}</span>
          <span class="lbl">Para Hoy</span>
        </div>
        <div class="cal-kpi-card ${sum.manana > 0 ? 'highlight' : ''}">
          <span class="val">${sum.manana}</span>
          <span class="lbl">Para Mañana</span>
        </div>
        <div class="cal-kpi-card">
          <span class="val">${sum.semana}</span>
          <span class="lbl">Próximos 7 Días</span>
        </div>
      </div>

      <!-- Pestañas de vista y controles de navegación -->
      <div class="card" style="padding:12px;margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div class="cal-tabs">
            <button class="cal-tab ${calCurrentView==='month'?'active':''}" id="tab_view_month">📅 Calendario</button>
            <button class="cal-tab ${calCurrentView==='agenda'?'active':''}" id="tab_view_agenda">📋 Lista de Actividades</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="btn sec sm" id="cal_prev">&lsaquo; Anterior</button>
            <button class="btn sec sm" id="cal_today">Hoy</button>
            <h2 style="margin:0;font-size:16px;min-width:140px;text-align:center">${MONTHS[curMonth]} ${curYear}</h2>
            <button class="btn sec sm" id="cal_next">Siguiente &rsaquo;</button>
          </div>
        </div>
      </div>

      <!-- Contenido según la vista seleccionada -->
      ${calCurrentView === 'month' ? `
        <div class="cal-wrap card" style="padding:14px">
          <div class="cal-grid">${DAYS.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}${cells}</div>
        </div>
      ` : `
        <div class="cal-agenda-wrap">
          ${agendaHtml}
        </div>
      `}
    `;

    // Event handlers
    $('#tab_view_month').onclick = () => { calCurrentView = 'month'; render(); };
    $('#tab_view_agenda').onclick = () => { calCurrentView = 'agenda'; render(); };

    $('#cal_prev').onclick  = () => { curMonth--; if (curMonth < 0) { curMonth=11; curYear--; } render(); };
    $('#cal_next').onclick  = () => { curMonth++; if (curMonth > 11) { curMonth=0; curYear++; } render(); };
    $('#cal_today').onclick = () => { curYear = today.getFullYear(); curMonth = today.getMonth(); render(); };

    $('#cal_new_ev').onclick = () => openEventModal();

    if (isA && $('#cal_user_filter')) {
      $('#cal_user_filter').onchange = e => { filterUserId = e.target.value; render(); };
    }

    // Push toggle
    $('#btn_toggle_push').onclick = async () => {
      const cur = await getPushStatus();
      if (cur === 'subscribed') {
        if (confirm('¿Desea desactivar las notificaciones push en este dispositivo?')) {
          await unsubscribePush();
          render();
        }
      } else {
        const ok = await subscribePush();
        if (ok) render();
      }
    };

    // Clic en celdas para agendar en ese día
    document.querySelectorAll('.cal-cell[data-day]').forEach(cell => {
      cell.onclick = e => {
        if (e.target.closest('.cal-ev')) return;
        const d = parseInt(cell.dataset.day);
        openEventModal(null, new Date(curYear, curMonth, d));
      };
    });

    // Clic en evento para ver/editar
    document.querySelectorAll('[data-evid]').forEach(el => {
      el.onclick = e => {
        e.stopPropagation();
        const ev = events.find(v => v.id == el.dataset.evid);
        if (ev) openEventModal(ev);
      };
    });
  }

  render();
}

function fieldHtml([n, l, t, req]) {
  const id = 'f_' + n, r = req ? ' required' : '', opts = a => a.map(o => `<option>${esc(o)}</option>`).join('');
  let i;
  const stList = Object.keys(geo).length ? Object.keys(geo) : ESTADOS;
  if (t === 'hidden') return `<input type="hidden" id="${id}">`;
  if (t === 'area') i = `<textarea id="${id}" rows="3"></textarea>`;
  else if (t === 'inst') i = `<select id="${id}"${r}><option value="">Seleccione…</option>${opts(cat.institucion.map(o => o.nombre))}</select>`;
  else if (t === 'estado') i = `<select id="${id}"><option value="">Seleccione…</option>${opts(stList)}</select>`;
  else if (t === 'ciudad') i = `<input id="${id}" list="dl_ciudades" autocomplete="off" placeholder="Seleccione o escriba…"><datalist id="dl_ciudades"></datalist>`;
  else if (t === 'yn') {
    i = `<select id="${id}"><option value=""></option>${opts(['Sí', 'No'])}</select>`;
    if (n === 'muestras_entregadas') {
      i += `<div id="muestras_box" style="display:none;margin-top:8px">
        <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(15,157,138,.12);border:1px solid var(--ac);border-radius:8px;font-size:13px;color:var(--tx)">
          <span id="muestras_resumen"></span>
          <button type="button" class="btn sec sm" id="btn_editar_muestras" style="padding:2px 8px;font-size:12px">Modificar</button>
        </div>
      </div>`;
    }
  }
  else if (t === 'esp') i = `<input id="${id}" list="dl_esp" autocomplete="off"><datalist id="dl_esp">${opts(cat.especialidad.map(o => o.nombre))}</datalist>`;
  else i = `<input id="${id}" type="${t || 'text'}"${r}>`;

  const isProtectable = !['muestras_entregadas','muestras_detalle','usaria_producto','prescribe_suplementos','prescribira_suplementos','comprometido','observaciones'].includes(n);
  const editBtn = isProtectable ? `<button type="button" class="btn-edit-fld" data-target="${id}" title="Editar este campo">✏️ <span>Editar</span></button>` : '';

  return `<label class="fld ${t === 'area' ? 'full' : ''}" id="lbl_${n}"><div style="display:flex;align-items:center;justify-content:space-between;width:100%"><span>${l}${req ? ' *' : ''}</span>${editBtn}</div>${i}</label>`;
}

      }

  const openMuestrasModal = () => {
    const current = parseMuestras(hidDetalle ? hidDetalle.value : '');
    const prods = (cat.muestra && cat.muestra.length)
      ? cat.muestra.map(p => p.nombre)
      : (cat.producto && cat.producto.length ? cat.producto.map(p => p.nombre) : ['Prokal Qx', 'Prokal Carbo Neutro', 'Prokal Proteína', 'Prokal Fibra', 'Prokal Vit']);

    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
      <div class="card" style="max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
        <div class="row2" style="justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0">Muestras médicas entregadas</h2>
          <button type="button" class="btn sec sm" id="m_close" style="font-size:16px;padding:2px 8px">✕</button>
        </div>
        <p style="color:var(--mut);font-size:13px;margin:0 0 16px">Selecciona los productos entregados e ingresa la cantidad (máximo 4 dígitos):</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px" id="m_list">
          ${prods.map(p => {
            const qty = current[p] || '';
            const isChecked = !!qty;
            return `
              <div class="m_row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;font-weight:500;margin:0">
                  <input type="checkbox" class="m_chk" data-prod="${esc(p)}" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--ac);cursor:pointer">
                  <span>${esc(p)}</span>
                </label>
                <div class="m_qty_wrap" style="display:${isChecked ? 'inline-flex' : 'none'};align-items:center;gap:6px">
                  <span style="font-size:12px;color:var(--mut)">Cant:</span>
                  <input type="text" inputmode="numeric" pattern="[0-9]*" class="m_qty" data-prod="${esc(p)}" value="${esc(qty)}" placeholder="0" maxlength="4" style="width:70px;padding:6px 8px;text-align:center;font-size:14px;font-weight:600;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)">

          inp.select();

          wrap.style.display = 'none';
          inp.value = '';

      if (!hidDetalle.value) selMuestras.value = 'No';
      close();
      updateMuestrasUI();
    };
    modal.querySelector('#m_cancel').onclick = () => {
      if (!hidDetalle.value) selMuestras.value = 'No';
      close();
      updateMuestrasUI();
    };
    modal.querySelector('#m_save').onclick = () => {
      const selected = [];
      let hasError = false;
      modal.querySelectorAll('.m_chk').forEach(chk => {
        if (chk.checked) {
          const p = chk.dataset.prod;
          const row = chk.closest('.m_row');
          const qty = row.querySelector('.m_qty').value.trim();
          if (!qty || parseInt(qty, 10) <= 0) {
            hasError = true;
            toast('Introduce la cantidad para ' + p, 1);

            selected.push(`${p} (${parseInt(qty, 10)})`);

  if (selMuestras) {
    selMuestras.onchange = () => {

        updateMuestrasUI();

    if (btnEdit) btnEdit.onclick = openMuestrasModal;
  }

  // Protección de campos para visitas recurrentes
  const protectableFields = ALLF.filter(f => !['muestras_entregadas','muestras_detalle','usaria_producto','prescribe_suplementos','prescribira_suplementos','comprometido','observaciones'].includes(f[0])).map(f => f[0]);

  const setProtectedMode = (isProtected) => {
    protectableFields.forEach(k => {
      const el = $('#f_' + k);

        btn.innerHTML = '✏️ <span>Editar</span>';

      e.preventDefault();
      const targetEl = $('#' + btn.dataset.target);
      if (!targetEl) return;
      if (targetEl.disabled) {
        targetEl.disabled = false;
        targetEl.classList.remove('fld-protected');
        targetEl.focus();
        btn.innerHTML = '🔒 <span>Bloquear</span>';
      } else {
        targetEl.disabled = true;
        targetEl.classList.add('fld-protected');
        btn.innerHTML = '✏️ <span>Editar</span>';
      }
    };
  });

  const getFullCedula = () => {
    const pref = $('#ced_pref') ? $('#ced_pref').value : 'V-';

  };

    const full = getFullCedula();
    const badge = $('#visita_status_badge');
    const info = $('#ced_info_box');
    const spin = $('#ced_spinner');

    if (!full || $('#ced_num').value.trim().length < 4) {
      if (!full) {
        currentTipoVisita = 'primera';
        badge.innerHTML = '<span class="badge" style="background:rgba(15,157,138,.15);color:var(--ac);font-size:12px;padding:4px 10px">✨ Primera visita</span>';
        info.innerHTML = '';
        setProtectedMode(false);
        lastSearchedCedula = '';
      }
      return;
    }

    if (!force && full === lastSearchedCedula) return;
    lastSearchedCedula = full;
    spin.style.display = 'block';

    try {
      const r = await api('/api/visits/by-cedula/' + encodeURIComponent(full));
      spin.style.display = 'none';

      if (r.found && r.visit) {
        currentTipoVisita = 'recurrente';
        const x = r.visit;
        badge.innerHTML = '<span class="badge" style="background:rgba(59,130,246,.15);color:#2563eb;font-size:12px;padding:4px 10px">🔄 Visita recurrente</span>';
        info.innerHTML = `<div style="color:var(--tx);background:rgba(15,157,138,.08);padding:10px 14px;border-radius:8px;border:1px solid rgba(15,157,138,.25);line-height:1.5">
          <b style="color:var(--ac)">✓ Médico registrado:</b> <b>${esc(x.cliente || x.razon_social)}</b> · ${esc(x.razon_social)} <span style="color:var(--mut)">(${esc(x.especialidad || 'Sin especialidad')})</span>
          <div style="font-size:12px;color:var(--mut);margin-top:4px">Datos anteriores cargados en <b>modo protegido</b>. Los campos de <b>Evaluación comercial</b> y <b>Evidencia</b> están activos para esta visita. Haz clic en ✏️ <i>Editar</i> si deseas modificar algún dato anterior.</div>
        </div>`;

        PREFILL.forEach(k => {
          const el = $('#f_' + k);
          if (el) el.value = x[k] || '';
        });
        if ($('#f_cedula')) $('#f_cedula').value = full;
        if (x.estado) updateCiudades(x.estado, true);

        // Reset commercial evaluation for this new visit
        if (selMuestras) selMuestras.value = '';
        if (hidDetalle) hidDetalle.value = '';
        if (boxMuestras) boxMuestras.style.display = 'none';
        ['usaria_producto','prescribe_suplementos','prescribira_suplementos','comprometido','observaciones'].forEach(k => {
          const el = $('#f_' + k); if (el) el.value = '';
        });

        setProtectedMode(true);
        toast('Médico encontrado · Datos cargados en modo protegido');
      } else {
        currentTipoVisita = 'primera';
        badge.innerHTML = '<span class="badge" style="background:rgba(15,157,138,.15);color:var(--ac);font-size:12px;padding:4px 10px">✨ Primera visita</span>';
        info.innerHTML = `<div style="color:var(--mut);background:rgba(0,0,0,.03);padding:8px 12px;border-radius:8px">No existe registro previo con la cédula <b>${esc(full)}</b>. El sistema lo considera una primera visita y habilita todos los campos.</div>`;
        if ($('#f_cedula')) $('#f_cedula').value = full;
        setProtectedMode(false);
      }
    } catch (e) {
      spin.style.display = 'none';
      console.error(e);
    }
  };

  let cedTm;
  $('#ced_num').oninput = e => {

  let tm; $('#lk').oninput = e => { clearTimeout(tm); tm = setTimeout(async () => {

      if (x.estado) updateCiudades(x.estado, true);
      if (x.cedula) {
        const m = /^([VEPJG]-)(.+)$/i.exec(x.cedula.trim());
        if (m) {
          $('#ced_pref').value = m[1].toUpperCase();

      $('#ced_info_box').innerHTML = `<div style="color:var(--tx);background:rgba(15,157,138,.08);padding:10px 14px;border-radius:8px;border:1px solid rgba(15,157,138,.25)"><b>✓ Médico seleccionado:</b> <b>${esc(x.cliente || x.razon_social)}</b> · Datos cargados en modo protegido.</div>`;
      setProtectedMode(true);
      box.style.display = 'none';
      toast('Datos cargados de la visita anterior');
    });
  }, 300); };

  const c = $('#sig'), x = c.getContext('2d'); let d = false, dirty = false;
  const clr = () => { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.strokeStyle = '#111'; x.lineWidth = 3; x.lineCap = 'round'; dirty = false; }; clr();
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { d = dirty = true; x.beginPath(); x.moveTo(...pos(e)); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (d) { x.lineTo(...pos(e)); x.stroke(); } };
  c.onpointerup = () => d = false; $('#sigc').onclick = clr;
  let foto = null;
  $('#foto').onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image(); im.onload = () => {
    const s = Math.min(1, 1280 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = im.width * s; cv.height = im.height * s;
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); foto = cv.toDataURL('image/jpeg', .8); $('#fprev').src = foto; $('#fprev').style.display = 'block'; }; im.src = URL.createObjectURL(f); };
  $('#gps').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => $('#f_ubicacion').value = p.coords.latitude.toFixed(6) + ', ' + p.coords.longitude.toFixed(6), () => toast('No se pudo obtener la ubicación (requiere HTTPS o localhost y permiso)', 1)) : toast('Geolocalización no disponible', 1);

  $('#save').onclick = async () => {
    const fullCed = getFullCedula();
    if ($('#f_cedula')) $('#f_cedula').value = fullCed;

    const body = {
      tipo_visita: currentTipoVisita || 'primera',
      cedula: fullCed,
      foto,
      firma: dirty ? c.toDataURL('image/png') : null,
      ubicacion: $('#f_ubicacion').value
    };
    ALLF.forEach(f => {
      const el = $('#f_' + f[0]);
      if (el) body[f[0]] = el.value;
    });
    body.cedula = fullCed;
    body.tipo_visita = currentTipoVisita || 'primera';

    if (!body.lugar_visita || !body.razon_social) return toast('Completa lugar de visita y razón social', 1);
    $('#save').disabled = true;

    const client_uuid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('off_' + Date.now() + '_' + Math.random().toString(36).slice(2));
    const fecha_offline = new Date().toISOString();
    body.client_uuid = client_uuid;
    body.fecha_offline = fecha_offline;

    try {
      if (!navigator.onLine) {
        throw new Error('NETWORK_OFFLINE');
      }
      await api('/api/visits', { method: 'POST', body });
      toast('Visita guardada exitosamente en el servidor');
      go('visitas');
    } catch (e) {
      if (e.isOffline || e.message === 'NETWORK_OFFLINE' || !navigator.onLine) {
        await dbSaveOutbox({
          client_uuid,
          fecha_offline,
          body,
          created_at: Date.now()
        });
        updateNetStatus();
        toast('📱 Visita guardada localmente en tu dispositivo. Se sincronizará automáticamente al volver la señal.');
        go('visitas');
      } else {
        toast(e.message, 1);
        $('#save').disabled = false;
      }
    }
  };
}

function detail(v, reload) {
  const ub = v.ubicacion && /^-?\d/.test(v.ubicacion) ? `<a href="https://www.google.com/maps?q=${encodeURIComponent(v.ubicacion)}" target="_blank" rel="noopener">${esc(v.ubicacion)}</a>` : esc(v.ubicacion);
  const items = [['Fecha y hora', esc(fmtDT(v.fecha_hora))], ['Visitador', esc(v.visitador_nombre || v.visitador_email)]]
    .concat(['tipo_visita', ...ALLF.map(f => f[0])].filter(k => v[k]).map(k => [LABEL[k], esc(k === 'tipo_visita' ? (v[k] === 'recurrente' ? 'Recurrente' : 'Primera') : v[k])]));
  if (v.ubicacion) items.push(['Ubicación', ub]);
  if (v.foto) items.push(['Foto', `<img src="${v.foto}">`]);
  if (v.firma) items.push(['Firma', `<img src="${v.firma}">`]);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><div class="row2" style="justify-content:space-between"><h2>Visita #${v.id}</h2><span>${me.admin ? '<button class="btn dg sm" id="del">Eliminar</button> ' : ''}<button class="btn sec sm" id="cl">Cerrar</button></span></div>
    <dl class="kv">${items.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl></div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) m.remove(); }; m.querySelector('#cl').onclick = () => m.remove();
  const d = m.querySelector('#del'); if (d) d.onclick = async () => { if (confirm('¿Eliminar esta visita definitivamente?')) { await api('/api/visits/' + v.id, { method: 'DELETE' }); m.remove(); toast('Visita eliminada'); reload(); } };
}

function openUnifiedImportModal(initialSubcat) {
  let impType = (initialSubcat === 'productos') ? 'productos' : 'muestras';
  let rawFileContent = null;
  let parsedItems = [];

  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `
    <div class="card" style="max-width:580px;width:100%;max-height:88vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0;font-size:18px;display:inline-flex;align-items:center;gap:8px">
          📥 Importar desde Archivo CSV
        </h2>
        <button type="button" class="btn sec sm" id="imp_close" style="padding:2px 8px">✕</button>
      </div>

      <div style="margin-bottom:14px">
        <label style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;display:block;margin-bottom:6px">
          ¿Qué deseas importar?
        </label>
        <div class="seg" style="display:inline-flex;width:100%;margin:0">
          <button type="button" id="imp_tab_mue" class="${impType === 'muestras' ? 'on' : ''}" style="flex:1">
            📦 1) Muestras (Lista simple)
          </button>
          <button type="button" id="imp_tab_prd" class="${impType === 'productos' ? 'on' : ''}" style="flex:1">
            🏷️ 2) Productos (Cod. | Producto)
          </button>
        </div>
      </div>

      <div id="imp_guide" style="background:rgba(15,157,138,.07);border:1px solid rgba(15,157,138,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--tx);margin-bottom:14px;line-height:1.5">
      </div>

      <div style="margin-bottom:14px">
        <input type="file" id="imp_file" accept=".csv,text/csv,text/plain" style="display:none">
        <button type="button" class="btn sec" id="imp_pick_btn" style="width:100%;justify-content:center;padding:12px;border:2px dashed var(--bd);background:var(--card);font-weight:600">
          📁 Seleccionar archivo CSV o TXT
        </button>
        <div id="imp_file_info" style="font-size:12px;color:var(--mut);margin-top:6px;text-align:center"></div>
      </div>

      <div id="imp_preview_box" style="display:none;flex:1;overflow-y:auto;max-height:240px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:16px">
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn sec" id="imp_cancel">Cancelar</button>
        <button type="button" class="btn" id="imp_submit" disabled>Confirmar e Importar</button>
      </div>
    </div>
  `;

  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector('#imp_close').onclick = close;
  m.querySelector('#imp_cancel').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };

  const updateGuide = () => {
    const g = m.querySelector('#imp_guide');
    if (impType === 'muestras') {
      g.innerHTML = `
        <strong>Formato de Muestras:</strong> Archivo CSV o TXT tipo lista simple donde cada fila contiene el nombre de una muestra médica.<br>
        <code style="background:var(--card);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;font-size:11px">Ejemplo: Prokal Qx</code>
      `;
    } else {
      g.innerHTML = `
        <strong>Formato de Productos:</strong> Archivo CSV con 2 columnas/espacios (1ra: <strong>Cod.</strong> y 2da: <strong>Producto</strong>), separados por coma, punto y coma, tabulador o espacios.<br>
        <code style="background:var(--card);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;font-size:11px">Ejemplo: 001, Prokal Proteína 500g &nbsp;|&nbsp; PK-02; Prokal Fibra</code>
      `;
    }
  };

  const parseAndRender = () => {
    if (!rawFileContent) return;
    const lines = rawFileContent.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    parsedItems = [];

    if (impType === 'muestras') {
      for (const line of lines) {
        let val = line.replace(/^["']|["']$/g, '').trim();
        if (val.includes(',') || val.includes(';')) {
          val = val.split(/[,;]/)[0].trim().replace(/^["']|["']$/g, '');
        }
        const low = val.toLowerCase();
        if (['muestra','muestras','producto','productos','nombre','item','items','descripcion'].includes(low)) {
          continue;
        }
        if (val && !parsedItems.includes(val)) {
          parsedItems.push(val);
        }
      }
    } else {
      for (const line of lines) {
        let cod = '', nom = '';
        if (line.includes('\t')) {
          const p = line.split('\t').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(' ').trim();
        } else if (line.includes(';')) {
          const p = line.split(';').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(';').trim();
        } else if (line.includes(',')) {
          const p = line.split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join(',').trim();
        } else if (line.includes('|')) {
          const p = line.split('|').map(s => s.trim().replace(/^["']|["']$/g, ''));
          cod = p[0] || '';
          nom = p.slice(1).join('|').trim();
        } else {
          const match = line.match(/^(\S+)\s+(.+)$/);
          if (match) {
            cod = match[1].replace(/^["']|["']$/g, '').trim();
            nom = match[2].replace(/^["']|["']$/g, '').trim();
          } else {
            nom = line.replace(/^["']|["']$/g, '').trim();
          }
        }
        const cLow = cod.toLowerCase(), nLow = nom.toLowerCase();
        if (['cod','cod.','codigo','code','id'].includes(cLow) && ['producto','nombre','descripcion','desc','name','item'].includes(nLow)) {
          continue;
        }
        if (!nom && cod) { nom = cod; cod = ''; }
        if (nom) {
          if (!parsedItems.some(x => x.nombre.toLowerCase() === nom.toLowerCase())) {
            parsedItems.push({ codigo: cod, nombre: nom });
          }
        }
      }
    }

    const pBox = m.querySelector('#imp_preview_box');
    const btnSub = m.querySelector('#imp_submit');

    if (!parsedItems.length) {
      pBox.style.display = 'block';
      pBox.innerHTML = '<div style="color:var(--dg);text-align:center;padding:12px">⚠️ No se encontraron elementos válidos con el formato seleccionado.</div>';
      btnSub.disabled = true;
      btnSub.textContent = 'Confirmar e Importar';
      return;
    }

    pBox.style.display = 'block';
    if (impType === 'muestras') {
      pBox.innerHTML = `
        <div style="font-size:12px;color:var(--mut);margin-bottom:8px"><strong>${parsedItems.length}</strong> muestra(s) lista(s) para importar:</div>
        <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.7">
          ${parsedItems.map(it => `<li><b>${esc(it)}</b></li>`).join('')}
        </ol>
      `;
    } else {
      pBox.innerHTML = `
        <div style="font-size:12px;color:var(--mut);margin-bottom:8px"><strong>${parsedItems.length}</strong> producto(s) listo(s) para importar (Cod. | Producto):</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <thead>
            <tr style="border-bottom:1px solid var(--bd);text-align:left">
              <th style="padding:4px 8px;width:100px">Cod.</th>
              <th style="padding:4px 8px">Producto</th>
            </tr>
          </thead>
          <tbody>
            ${parsedItems.map(it => `
              <tr style="border-bottom:1px solid rgba(0,0,0,.05)">
                <td style="padding:4px 8px"><span class="badge" style="background:rgba(15,157,138,.12);color:var(--ac);font-family:monospace">${esc(it.codigo || '—')}</span></td>
                <td style="padding:4px 8px"><b>${esc(it.nombre)}</b></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    btnSub.disabled = false;
    btnSub.textContent = `Confirmar e Importar (${parsedItems.length} ${impType === 'muestras' ? 'muestras' : 'productos'})`;
  };

  updateGuide();

  m.querySelector('#imp_tab_mue').onclick = () => {
    impType = 'muestras';
    m.querySelector('#imp_tab_mue').classList.add('on');
    m.querySelector('#imp_tab_prd').classList.remove('on');
    updateGuide();
    parseAndRender();
  };
  m.querySelector('#imp_tab_prd').onclick = () => {
    impType = 'productos';
    m.querySelector('#imp_tab_prd').classList.add('on');
    m.querySelector('#imp_tab_mue').classList.remove('on');
    updateGuide();
    parseAndRender();
  };

  const fInput = m.querySelector('#imp_file');
  m.querySelector('#imp_pick_btn').onclick = () => fInput.click();
  fInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    m.querySelector('#imp_file_info').textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    const reader = new FileReader();
    reader.onload = evt => {
      rawFileContent = evt.target.result;
      parseAndRender();
    };
    reader.readAsText(file);
  };

  m.querySelector('#imp_submit').onclick = async () => {
    const btn = m.querySelector('#imp_submit');
    btn.disabled = true;
    btn.textContent = 'Importando…';
    try {
      const targetTipo = (impType === 'muestras') ? 'muestra' : 'producto';
      const res = await api('/api/catalogs/bulk', {
        method: 'POST',
        body: { tipo: targetTipo, items: parsedItems }
      });
      close();
      toast(`✅ Importación completada: ${res.added} nuevos elementos agregados (${res.total - res.added} actualizados o existentes)`);
      vConfig('producto', impType);
    } catch (err) {
      toast(err.message, 1);
      btn.disabled = false;
      btn.textContent = `Confirmar e Importar (${parsedItems.length})`;
    }
  };
}

      if (confirm('¿Eliminar este documento?')) {
        try {
          await api('/api/documentation/' + b.dataset.deldoc, { method: 'DELETE' });
          toast('Documento eliminado');
          vLiteratura();
        } catch (e) { toast(e.message, 1); }
      }
    });
  }
}

                </td>
                <td>${getBadge(r.accion)}</td>

        </table>
      `;

      $('#lg_pg').innerHTML = `
        <span style="color:var(--mut);font-size:13px">${total} eventos registrados</span>
        <span>
          <button class="btn sec sm" id="lg_pp" ${page === 0 ? 'disabled' : ''}>Anterior</button>
          <span style="margin:0 8px;font-size:13px">Pág. ${page + 1} de ${Math.ceil(total / PS) || 1}</span>
          <button class="btn sec sm" id="lg_pn" ${(page + 1) * PS < total ? '' : 'disabled'}>Siguiente</button>
        </span>
      `;

      if ($('#lg_pp')) $('#lg_pp').onclick = () => { if (page > 0) { page--; load(); } };
      if ($('#lg_pn')) $('#lg_pn').onclick = () => { if ((page + 1) * PS < total) { page++; load(); } };

    } catch (err) {
      $('#lg_tbl').innerHTML = `<div style="padding:24px;text-align:center;color:#dc2626">Error cargando logs: ${esc(err.message)}</div>`;
    }
  };

  $('#lg_apply').onclick = () => { page = 0; load(); };
  $('#lg_refresh').onclick = () => load();
  $('#lg_reset').onclick = () => {
    $('#lg_desde').value = '';

  };

  load();

// ---------- Notificaciones Web Push y Alertas de Actividades ----------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function getPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  if (Notification.permission !== 'granted') return 'prompt';
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return sub ? 'subscribed' : 'prompt';
  } catch {
    return 'unsupported';
  }
}

async function subscribePush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      toast('Las notificaciones Push no son soportadas en este navegador', 1);
      return false;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      toast('Permiso de notificaciones denegado', 1);
      return false;
    }
    const { publicKey } = await api('/api/push/vapid-key');
    if (!publicKey) {
      toast('Push VAPID no disponible en servidor', 1);
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }
    const subJson = sub.toJSON();
    await api('/api/push/subscribe', {
      method: 'POST',
      body: {
        endpoint: sub.endpoint,
        keys: {
          p256dh: subJson.keys?.p256dh,
          auth: subJson.keys?.auth
        }
      }
    });
    toast('🔔 Notificaciones de recordatorios activadas correctamente');
    return true;
  } catch (err) {
    console.error('Error al suscribir a push:', err);
    toast('Error activando notificaciones: ' + err.message, 1);
    return false;
  }
}

async function unsubscribePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await api('/api/push/subscribe', { method: 'DELETE', body: { endpoint: sub.endpoint } });
      await sub.unsubscribe();
    }
    toast('Notificaciones desactivadas en este equipo');
    return true;
  } catch (err) {
    toast('Error al desactivar: ' + err.message, 1);
    return false;
  }
}

let activeAlertModal = null;
const snoozedAlertIds = new Set();

function showActivityReminderAlert(ev) {
  if (!ev || !ev.id || snoozedAlertIds.has(ev.id)) return;
  if (activeAlertModal) return; // Ya hay una en pantalla

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.zIndex = '9999';

  const diff = Math.round((new Date(ev.inicio) - Date.now()) / 60000);
  let mainMsg = '';
  if (ev.recordatorio_min >= 1200) {
    mainMsg = `Recuerde que mañana tiene actividades agendadas: "${esc(ev.titulo)}".`;
  } else if (diff <= 0) {
    mainMsg = `La actividad agendada "${esc(ev.titulo)}" está comenzando en este momento.`;
  } else if (diff < 60) {
    mainMsg = `Recordatorio: En ${diff} minutos tiene agendada la actividad "${esc(ev.titulo)}".`;
  } else {
    const h = Math.round(diff / 60);
    mainMsg = `Recordatorio: En ${h} hora(s) tiene agendada la actividad "${esc(ev.titulo)}".`;
  }

  const dtStr = new Date(ev.inicio).toLocaleString('es-VE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

  modal.innerHTML = `
    <div class="card" style="max-width:480px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.25);border-top:5px solid var(--ac)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <span style="font-size:32px">🔔</span>
        <div>
          <h2 style="margin:0;font-size:18px">Recordatorio de Actividad</h2>
          <span style="font-size:12px;color:var(--mut)">Alerta del sistema de agenda</span>
        </div>
      </div>
      <div style="background:rgba(15,157,138,.08);border:1px solid rgba(15,157,138,.2);padding:14px;border-radius:10px;margin-bottom:16px">
        <p style="font-size:15px;font-weight:700;color:var(--tx);margin:0 0 10px;line-height:1.4">
          ${mainMsg}
        </p>
        <p style="font-size:14px;font-weight:600;color:var(--ac);margin:0 0 8px">
          ¿Desea ir a actividades agendadas?
        </p>
        <div style="font-size:13px;color:var(--mut);line-height:1.5">
          <div>📅 <strong>Fecha:</strong> ${dtStr}</div>
          ${ev.medico_ref ? `<div>👨‍⚕️ <strong>Médico:</strong> ${esc(ev.medico_ref)}</div>` : ''}
          ${ev.ubicacion ? `<div>📍 <strong>Lugar:</strong> ${esc(ev.ubicacion)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="btn sec" id="btn_alert_later">Recordar más tarde</button>
        <button class="btn sec dg" id="btn_alert_dismiss">Descartar</button>
        <button class="btn" id="btn_alert_go">📅 Ir a actividades agendadas</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
  activeAlertModal = modal;

  const closeAlert = () => {
    if (activeAlertModal) {
      activeAlertModal.remove();
      activeAlertModal = null;
    }
  };

  $('#btn_alert_later').onclick = () => {
    snoozedAlertIds.add(ev.id);
    setTimeout(() => snoozedAlertIds.delete(ev.id), 10 * 60 * 1000); // 10 min
    closeAlert();
  };

  $('#btn_alert_dismiss').onclick = async () => {
    try {
      await api(`/api/events/alerts/dismiss/${ev.id}`, { method: 'POST' });
    } catch {}
    closeAlert();
  };

  $('#btn_alert_go').onclick = async () => {
    try {
      await api(`/api/events/alerts/dismiss/${ev.id}`, { method: 'POST' });
    } catch {}
    closeAlert();
    go('agendar');
  };
}

async function checkActivityAlerts() {
  if (!me) return;
  try {
    const res = await api('/api/events/alerts');
    if (res.alerts && res.alerts.length > 0) {
      showActivityReminderAlert(res.alerts[0]);
    }
  } catch {}
}

// ---------- Registro de Service Worker y Eventos de Conectividad ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('Service Worker registrado:', reg.scope);
      checkActivityAlerts();
    }).catch(err => {
      console.warn('Error registrando Service Worker:', err);
    });
  });

  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'TRIGGER_SYNC') {
      checkPendingAndSync();
    }
    if (e.data && e.data.type === 'PUSH_REMINDER') {
      checkActivityAlerts();
    }
  });
}

window.addEventListener('online', () => {
  updateNetStatus();
  toast('🟢 Cobertura restablecida. Sincronizando datos...');
  checkPendingAndSync();
  checkActivityAlerts();
});

window.addEventListener('offline', () => {
  updateNetStatus();
  toast('🟠 Sin conexión a internet. Modo offline activado.', 1);
});

setInterval(checkPendingAndSync, 20000);
setInterval(checkActivityAlerts, 45000); // Revisar alertas de agenda cada 45 segundos

boot();
</script>
